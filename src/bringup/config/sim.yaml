# Sim defaults (sim_control_launch.py): the rig twin (the *_rig worlds), i.e. real.yaml's
# geometry, masses and affine thrust map on the sagging-pack plant.
# The base is the carry (mode:=mpc); each `modes:` entry lists only what that mode changes.
# legacy:=true reads sim_legacy.yaml instead (the worlds in simulation_assets/old_worlds/);
# mode:=network exists only there. mode:=attach flies the twin attach worlds (8 Oct):
# three_rigid_ground_rig_attach.sdf (QUAD4 free on the floor) and _attach_welded.sdf (welded on plate 9).
fleet_geometry:
  num_drones: 3
  cable_len: 0.55
  drone_mass: 0.55
  attach_radius: 0.225
  attach_z: 0.02
  pivot_offset_z: -0.04
  rod_tol_frac: 0.25
  rod_spread_m: 0.08
takeoff:
  ff_cap_force: 0.75
  lift_ramp_vel: 0.1
  z_taut_gate: 0.9
  payload_rest_z: 0.02
height_hold:
  z_i_gate: 0.25
trajectory:
  traj_speed: 0.4
thrust_map:
  thrust_ratio: 35.2
  takeoff_thrust_ratio: 0.0
  thrust_offset: 0.185
  thrust_offset_v_slope: 0.022
  throttle_max: 0.8
  kt_trim: false
fleet_resize:
  reconfig_mode: 'ocp'
network:
  auto_network_handover: false
sim_interface:
  sil: false
  sim_thrust_map: 'rig'
  sim_thrust_offset: 0.185
  sim_pack_v0: 23.8

modes:
  mpc: {}
  free_hover: {}
  dissipative:
    num_drones: 4
  attach:
    num_drones: 3
    # the M1 rig layout (real.yaml modes.attach): carriers on plates 3/11/7 (angles typed clockwise, 30 x plate),
    # the weld on plate 9 at +y 0.225
    attach_azimuths_deg: '90,330,210'
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    enable_approach_mpc: false
    control_mode: 'velocity_after_handover'
    vel_ki: 0.0
    diss_ki_load: 1.0
