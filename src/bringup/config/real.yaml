# Rig defaults (real_control_launch.py): the 30 Sep 2026 lab values (affine thrust map, rods pivoting 4 cm below
# the drone centre, magnets at r 0.225) with the 1 m cables of 22 Oct (each measured at the hand-over) and the
# ring's measured centre of mass (Wesley 22 Oct).
# The base is the carry (mode:=mpc); each `modes:` entry lists only what that mode changes.
# attach and m2 are the M1/M2 rig modes (the sim graphs with bringup/real_mode.py's rig
# watchdogs and creep start); they fly the same rig thrust map and geometry (Wesley 2026-10-03).
fleet_geometry:
  num_drones: 4
  cable_len: 1.0
  drone_mass: 0.583            # kg with pack, cable and magnet: the 0.55 m cable's 0.040 kg is ~0.073 at 1 m (Wesley 22 Oct)
  load_mass: 1.15              # the new payload of 28 Oct (Wesley: 1.15 kg, 510 mm, slots ~100 x 85 mm); the M2A ring's
                               # 0.86 kg values fly with params_file:=configs/rig/ring_m2a.yaml
  load_ixx: 0.0246             # kg m^2, estimated: a flat annulus, outer r 0.255, inner r ~0.14 (not measured);
                               # izz/2 plus the 26 mm thickness, as the twin's _p115 worlds
  load_izz: 0.049
  attach_radius: 0.204         # the magnet markers on plates 0/3/6/9, 0.201-0.209 m from the centre (RIG-1028-payload)
  attach_z: 0.025              # the plate faces above the pivot: markers 2.7 cm up less the old 2.25 mm marker offset (estimate)
  pivot_offset_z: -0.04
  rod_tol_frac: 0.25
  rod_spread_m: 0.08
takeoff:
  lift_ramp_vel: 0.1
  z_taut_gate: 0.9
  payload_rest_z: 0.013        # the new payload's Motive pivot at rest (28 Oct: 1.30-1.31 cm, centre of mass ~1 cm)
height_hold:
  z_i_gate: 0.25
trajectory:
  land_unwind: false           # rig: straight down after touchdown; the rig tethers are cables that go slack (Wesley 7 Oct); the twin keeps the unwind (rigid links)
  traj_speed: 0.125            # m/s path speed (Wesley 7 Oct; the figure-8 now holds it along the whole lap)
  fig8_size: 0.75              # m: the rig's paths shrink to 0.75 so the outboard quad stays ~1.475 m out, well inside
  traj_distance: 0.75          # the +-1.75 m position limit (Wesley 22 Oct); line_x / line_spin go 0.75 m out
  hover_z: 0.8
  climb_vel: 0.15
  land_tol: 0.10
thrust_map:
  thrust_ratio: 35.2
  takeoff_thrust_ratio: 0.0
  thrust_offset: 0.185
  thrust_offset_v_slope: 0.022
  throttle_max: 0.8
  kt_trim: false
watchdogs:
  solve_budget_s: 0.06
  require_fc_armed: true
  pos_limit_m: 1.75             # the rig's +-1.75 m position limit, on (Wesley 22 Oct, after its critic and the LIM runs)
fleet_resize:
  reconfig_mode: 'ocp'
  detach_magnet: true
network:
  auto_network_handover: false
# combined M1 contact attach on the rig (mode:=attach partner:=true partner_contact:=true): more Motive bodies
# ('<id>:/<topic>,...'; '' = his ball 6:/pickup/motion_capture_state under partner_contact), his mission's rig
# nodes started by this launch (partner_nodes), and launch arguments for them ('k:=v k:=v')
combined_m1:
  mocap_extra_bodies: ''
  partner_nodes: false
  partner_args: ''
  # partner_contact refuses load_traj orbit on the rig until the co-moving take-back is reviewed (card
  # 2026-10-10_combined_m1_contact rev 10, TB16): true typed on the command line lifts the refusal, with Wesley's
  # word (a params_file value is ignored)
  contact_rig_orbit: false

tracker:
  # the measured pull's filter on the rig (Wesley 29 Oct): the 1 m ring bends at 5.3 Hz (RIG-1029-h4). Two 2 Hz low-pass
  # stages stopped it (RIG-1029-ch1b) but their ~120 ms of lag let the triangle swing at 1.1 Hz (RIG-1029-sq2_2, -sq2_4);
  # a band-stop at 5.3 Hz instead (~30 ms at 1.1 Hz). The low-pass is kept, off: cable_lp_hz 2.0, cable_lp_order 2 to fly it
  cable_lp_hz: 0.0
  cable_notch_hz: 5.3
  cable_notch_q: 1.0
modes:
  mpc: {}
  free_hover:
    land_vel: 0.15
    # one drone circles its takeoff point after the hover (tracker/free_hover.py); 0 = off.
    # configs/rig/free_hover_circle.yaml turns it on
    circle_radius: 0.0
    circle_period_s: 6.0
    circle_laps: 3
    circle_hold_s: 5.0
  dissipative: {}
  attach:
    num_drones: 3
    # M1 rig layout (Wesley 8 Oct): carriers on plates 3/11/7 (angles typed clockwise, 30 x plate, since 15 Oct),
    # QUAD4 welds onto plate 9 (270 deg cw, ring +y) at the magnets' radius 0.225 (the legacy sim's 0.25 / -y weld
    # is at 90 deg cw)
    attach_azimuths_deg: '90,330,210'
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    control_mode: 'velocity_after_handover'
    vel_ki: 0.0
    diss_ki_load: 1.0
  m2: {}
