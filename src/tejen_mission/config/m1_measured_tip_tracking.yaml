# Opt-in local XY trim only. No progression gates or hardware geometry overrides.
# Both M1 launchers load this overlay; target_alignment_mode remains legacy
# unless explicitly selected as measured_tip_trim.
online_join_planner:
  ros__parameters:
    target_alignment_gain_per_s: 0.8
    target_alignment_filter_tau_s: 0.5
    target_alignment_max_rate_mps: 0.025
    target_alignment_max_offset_m: 0.08
    target_alignment_min_normal_m: 0.08
    target_alignment_max_relative_speed_mps: 0.08
