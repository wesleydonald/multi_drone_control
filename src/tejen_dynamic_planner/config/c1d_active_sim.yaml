dynamic_planner_active_commissioning:
  ros__parameters:
    # The inspected current SimClean stack has no /clock publisher. Keep this
    # false unless the actual stack is changed and re-inspected.
    use_sim_time: false

    state_topic: /motion_capture_state
    pendulum_topic: /pendulum_swing_state
    command_topic: /drone_command
    reference_topic: /join_planner/reference
    diagnostics_topic: /dynamic_planner/c1d_status
    marker_topic: /dynamic_planner/markers
    csv_path: /tmp/r6_3c1d_active.csv
    trace_csv_path: ""
    frame_id: map
    vehicle_id: drone_0
    commissioning_label: R6.3C.1d

    state_timeout_s: 0.25
    pendulum_timeout_s: 0.25
    acceleration_filter_tau_s: 0.15

    # Validated suspended planner cadence from C.1b/C.1c.
    planner_rate_hz: 5.0
    marker_rate_hz: 5.0
    minimum_search_z_m: 0.20

    # C.1b measured normal suspended solves around 129 ms mean / 135 ms p95 /
    # 153 ms max. Seed the first active future-splice calculation at 160 ms so
    # the first candidate does not start with the old 83 ms bootstrap lookahead.
    initial_splice_timing_s: 0.16
    spline_time_factor: 2.5

    # C.1d1 takeoff/reference ownership. Seventh-order rest-to-rest profile gives
    # zero endpoint velocity, acceleration and jerk.
    hover_z_m: 1.20
    takeoff_duration_s: 4.0

    # Require vehicle AND suspended-load settling continuously before enabling
    # the persistent planner. Swing limits are commissioning defaults, not a
    # literature-derived universal bound; tighten from measured flight data later.
    settle_dwell_s: 1.0
    settle_position_tolerance_m: 0.10
    settle_speed_tolerance_mps: 0.10
    settle_accel_tolerance_mps2: 0.50
    settle_swing_tolerance_rad: 0.08726646259971647   # 5 deg
    settle_swing_rate_tolerance_radps: 0.20

    # First authoritative mission is deliberately boring: +1 m in X at the
    # settled hover altitude, then the planner's certified stopped terminal hold.
    goal_dx_m: 1.0
    goal_dy_m: 0.0
    goal_dz_m: 0.0

    # Preserve the passed C.1d clear-space geometry and disable C.1e's scene.
    max_swing_angle_rad: 0.17453292519943295   # 10 deg
    swing_warning_rad: 0.17453292519943295
    swing_claim_invalid_rad: 0.17453292519943295
    static_scene_enabled: false
    require_scene_witness: false
    measured_trace_capacity: 900
