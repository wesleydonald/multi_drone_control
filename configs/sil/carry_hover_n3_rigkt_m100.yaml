name: carry_hover_n3_rigkt_m100
description: 'R0a prime (readiness review 2026-09-29, K1): the n3 even-ring hover carry at the RIG thrust gain (plant thrust_c
  21.8 = 9.81/0.45, the measured free-hover throttle; typed kT 21.8, trim off, z_ki default 0.4) with drone mass 1.0 kg. Predicted
  carry throttle (tools/headroom.py): 0.59, at the cap. Exploratory: what the stack does when the tracker''s 0.6 throttle
  cap binds.'
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: attach
    num_drones: 3
    reserved_attach: 0
    enable_approach: false
    start_taut: true
    load_traj: hover
    cable_len: 0.5
    attach_azimuths_deg: even
    load_mass: 0.86
    target_z: 0.6
    kt_trim: false
    thrust_ratio: 21.8
    drone_mass: 1.0
fleet:
  n_tethered: 3
  n_total: 3
geometry:
  cable_len: 0.5
  attach_radius: 0.25
  attach_z: 0.025
  load_mass: 0.86
  drone_mass: 1.0
  thrust_c: 21.8
initial:
  stands: true
  load_z: 0.45
  elev_deg: 45.0
timing:
  dt: 0.02
  substeps: 20
  duration_s: 50.0
  step_timeout_s: 0.5
  ready_timeout_s: 300.0
events:
- t: 1.0
  do: ARM
- t: 10.0
  do: TAKEOFF
- t: 46.0
  do: LAND
