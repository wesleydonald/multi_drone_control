name: carry_hover_n3_long_kt125_x0b0_int
description: 'Card docs/experiments/2026-10-04_z_int_model.md: SIL kT +25 % fault, box at zero, the ring integral
  in the model (must rail and warn). One variable against carry_hover_n3_long_kt125_zki.'
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: attach
    num_drones: 3
    reserved_attach: 0
    enable_approach: false
    start_taut: true
    load_traj: hover
    cable_len: 0.5
    attach_azimuths_deg: even
    load_mass: 0.86
    target_z: 0.6
    thrust_ratio: 103.88
    z_ki: 0.4
    kt_trim: false
    x0_relax_frac: 0.0
    int_mode: model
    int_k_xy: 5.26
    int_k_z: 7.13
fleet:
  n_tethered: 3
  n_total: 3
geometry:
  cable_len: 0.5
  attach_radius: 0.25
  attach_z: 0.025
  load_mass: 0.86
initial:
  stands: true
  load_z: 0.45
  elev_deg: 45.0
timing:
  dt: 0.02
  substeps: 20
  duration_s: 50.0
  step_timeout_s: 0.5
  ready_timeout_s: 300.0
events:
- t: 1.0
  do: ARM
- t: 10.0
  do: TAKEOFF
- t: 46.0
  do: LAND
