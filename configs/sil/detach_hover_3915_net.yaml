description: 'Arm B: 30/90/150/270, detach the 90 deg drone in hover, NETWORK mode (network carries the
  transient, hands back to the n-1 OCP once still).'
events:
- t: 1.0
  do: ARM
- t: 10.0
  do: TAKEOFF
- t: 24.0
  do: DETACH
  arg: 1
- t: 50.0
  do: LAND
fleet:
  n_tethered: 4
  n_total: 4
geometry:
  attach_radius: 0.25
  attach_z: 0.025
  cable_len: 0.5
  load_mass: 0.86
  attach_azimuths_deg: 30,90,150,270
initial:
  elev_deg: 45.0
  load_z: 0.45
  stands: true
launch:
  args:
    mode: attach
    attach_azimuths_deg: 30,90,150,270
    cable_len: 0.5
    enable_approach: false
    kt_trim: true
    load_mass: 0.86
    load_traj: hover
    num_drones: 4
    reserved_attach: 0
    start_taut: true
    target_z: 0.6
    z_ki: 0.4
    reconfig_mode: network
    reconfig_hold_s: 1.5
  file: sim_control_launch.py
  package: bringup
name: detach_hover_3915_net
timing:
  dt: 0.02
  duration_s: 50.0
  ready_timeout_s: 300.0
  step_timeout_s: 0.5
  substeps: 20
