name: carry_hover_n3_yaw180
description: 'carry_hover_n3 with the ring spawned at yaw 180 deg (drones on the rotated slots).
  The plant publishes the w >= 0 quaternion like the rig mocap, so every yaw wiggle across 180
  flips its sign: the SIL arm of A4 (planner quaternion continuity, card 2026-10-01_tethered_model).

  '
launch:
  package: controller_quad_load
  file: three_attach_launch.py
  args:
    num_drones: 3
    reserved_attach: 0
    enable_approach: false
    start_taut: true
    load_traj: hover
    cable_len: 0.5
    attach_azimuths_deg: even
    load_mass: 0.86
    target_z: 0.6
    kt_trim: false
    z_ki: 0.0
fleet:
  n_tethered: 3
  n_total: 3
geometry:
  cable_len: 0.5
  attach_radius: 0.25
  attach_z: 0.025
  load_mass: 0.86
initial:
  stands: true
  load_z: 0.45
  elev_deg: 45.0
  load_yaw_deg: 180.0
timing:
  dt: 0.02
  substeps: 20
  duration_s: 20.0
  step_timeout_s: 0.5
  ready_timeout_s: 300.0
events:
- t: 1.0
  do: ARM
- t: 3.0
  do: TAKEOFF
- t: 16.0
  do: LAND
