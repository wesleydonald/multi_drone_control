name: carry_hover_n3_long_3129
description: 'Uneven hang: 3/12/9 o clock (attach_azimuths 0,90,180), the 3-drone layout that hangs tilted
  with unequal shares; kt_trim off (card 2026-09-23_kt_trim.md, critic 6: per-drone gain spread on an
  uneven layout).'
launch:
  package: controller_quad_load
  file: three_attach_launch.py
  args:
    num_drones: 3
    reserved_attach: 0
    enable_approach: false
    start_taut: true
    load_traj: hover
    cable_len: 0.5
    attach_azimuths_deg: 0,90,180
    load_mass: 0.86
    target_z: 0.6
    kt_trim: false
    z_ki: 0.0
fleet:
  n_tethered: 3
  n_total: 3
geometry:
  cable_len: 0.5
  attach_radius: 0.25
  attach_z: 0.025
  load_mass: 0.86
  attach_azimuths_deg: 0,90,180
initial:
  stands: true
  load_z: 0.45
  elev_deg: 45.0
timing:
  dt: 0.02
  substeps: 20
  duration_s: 50.0
  step_timeout_s: 0.5
  ready_timeout_s: 300.0
events:
- t: 1.0
  do: ARM
- t: 10.0
  do: TAKEOFF
- t: 46.0
  do: LAND
