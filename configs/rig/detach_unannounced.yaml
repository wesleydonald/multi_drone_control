# rig unannounced detach (Wesley 7 Oct evening): the magnet is switched off directly, the planner
# is not told; it detects the stretched cable (0.06 m over its length for 0.2 s) and resizes.
# Measured pull (the default); the freed drone steps 0.5 m out from the ring after the detection
detach_detect_m: 0.06
detach_step_out_m: 0.5
