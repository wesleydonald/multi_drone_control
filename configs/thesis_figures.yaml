# configs/thesis_figures.yaml — the thesis figure registry (THESIS_PLAN §9.4)
#
# Every figure in the document is declared here and regenerated by
# `tools/thesis_figures.py`, so a late data fix propagates everywhere instead of
# leaving a stale PNG in the thesis.
#
# The runs a figure cites SHOULD live in results_archive/ (§4.3: promotion is the
# moment data becomes safe). thesis_figures.py resolves the archive first and warns
# loudly for any figure still built from the mutable results/ tree — treat that warning
# as "archive this before writing the caption", not as noise.
#
# kind: run      -> the six per-run figures (tools/plot_run.py); `keep` selects which
# kind: compare  -> an overlay + metric table (tools/compare_runs.py)
# kind: storyboard -> the attach-during-trajectory demo as one figure (tools/attach_storyboard.py)

output: docs/figures

figures:
  - id: F_attach_elevation_45_v_65
    kind: compare
    runs: [R0034-R0038, R0039-R0043]
    labels: ["45 deg settle", "65 deg settle"]
    align: event
    caption: >
      Ring attach in Gazebo at two settle elevations, five repeats each, aligned on the
      weld. Both elevations diverge on the current plant: drone-3 peak error 1.11 m
      (45 deg) against 1.17 m (65 deg). This is the measurement that invalidated the
      §9.3 acceptance criterion's DISCRIMINATION claim — the pair no longer separates,
      so it cannot be used to judge the SIL bench until the kT/plant mismatch is
      resolved.

  - id: F_attach_45_single
    kind: run
    runs: [R0034]
    keep: [02_error, 04_health]
    caption: >
      One 45 deg ring-attach run in detail. The fleet tracks to within a few
      centimetres until the weld at t=37.4 s, after which every drone's error steps to
      ~1 m and the fleet aborts 3.9 s later.

  - id: F_attach_demo_storyboard
    kind: storyboard
    runs: [R0209]
    # thesis caption: no run id (Wesley 2026-09-29); every number printed by the script
    caption: >
      Attach during a circle in Gazebo (0.6 kg ring of radius 0.25 m on 0.5 m rods).
      (a) The fleet at the four numbered instants, rebuilt from the logged poses in one
      orthographic view: carriers grey, newcomer red; thick: near half of the ring;
      dotted: the ring if it were level; bar: 0.25 m. (b) Plan view of the ring centre
      (gold; circle: start, square: end), the payload target (dashed; x: held from
      ATTACH) and the newcomer's approach (red), with the ring and its rim anchors at the
      weld. (c) Ring tilt; grey band: target held; dashed: 10 deg. Three drones at 3, 12
      and 9 o'clock start the circle with the ring tilted by 34-37 deg. ATTACH holds the
      target and the newcomer welds to the empty 6 o'clock rim. During the 8 s hand-out
      the tilt first rises to 43 deg; from 9.3 s after the weld it stays under 10 deg
      (mean 4.4 deg, peak 9.96 deg), and the four drones fly the rest of the circle,
      0.20 m RMS from the target against 0.02 m with three.

  - id: F_tracker_x0
    kind: script            # tools/thesis_sim_figures.py (fig_tracker_x0)
    runs: [R0841, R0960, R0832, R0974]
    caption: >
      Effect of the tracker's initial condition without integral action (thesis/Source/src/sim_results.tex,
      fig:tracker_x0). (a) Gazebo hover from the floor, (b) Gazebo circle, first lap, epsilon 0.025
      against 0. The SIL panel (R0956/R0957) was dropped on 5 Oct 2026 (docs/redo_on_twin.md, row 10).

  - id: F_disturbance
    kind: script            # tools/thesis_sim_figures.py (fig_disturbance)
    runs: [R0962, R0968, R0969, R0961, R0971]
    caption: >
      Rejection of a constant force on the ring in the Gazebo rig twin, epsilon 0 (sim_results.tex,
      fig:disturbance): 0.6 N down and 0.4 N horizontal; no integral, target shift, model integral.

  # tables of sim_results.tex (tools/thesis_sim_tables.py -> thesis/Source/src/tables/): x0 (R0841/R0844, R0960/R0978, R0832, R0974/R0979), disturbance (the *_x0b0 push/pushz/mapneg configs, every
  # non-void run), gain (R0969, R0976, R0977), four (R0931/R0932, R0936, R0933, R0935, R0939)
  # land (STRAIGHT list + the land_matrix / land_fix card runs), robust (sim_robustness.tex: R1038-R1067
  # non-void + R1013/R1023), params (hardware.tex: the rig profile, no runs), traj (the *_lf / *_x0b0 configs
  # in TRAJ, every non-void run: R1013/R1023, R1018/R1032, R0974/R0979/R1027.., R1033/R1037, R1035/R1036,
  # line R1068/R1070, spin R1069/R1071), detach (sim_detach.tex: R0939; R0997, R1007, R1012, R1029, R1034)

  - id: F_landing
    kind: script            # tools/thesis_sim_figures.py (fig_landing)
    runs: [R0960, R1013]
    caption: >
      Landing after the payload touches down, Gazebo rig twin, three UAVs (interchangeable; one run of
      each). (a, c) Straight descent, the cable feedforward cut at touchdown; (b, d) unwind along the
      rods, a 1 s feedforward ramp and idle on the floor. (a, b) Radial offset from the reference,
      positive outward, to 0.25 m (dot); (c, d) lean along the outward radial; dotted +-2 deg.

  - id: F_detach
    kind: script            # tools/thesis_sim_figures.py (fig_detach)
    runs: [R1012]
    caption: >
      Detach of one UAV of four by OCP resize (plates 1/3/5/9): planned tensions per UAV (released UAV
      dashed, coloured), ring tilt with the hover band + 0.5 deg (dotted) and the settling time, height
      error against the 1.0 m target.

  - id: F_traj
    kind: script            # tools/thesis_sim_figures.py (fig_trajectories)
    runs: [R1033, R1035, R0933, R0935]
    caption: >
      Four-UAV circle and figure-8 with epsilon 0 (paths on the references) and the horizontal error
      against the relaxed box, over the motion only.

  - id: F_flight
    kind: script            # tools/thesis_sim_figures.py (fig_flight)
    runs: [R1013]
    caption: >
      One flight from the floor, three UAVs: heights and rod elevations through creep, pretension, lift,
      hover, LAND and unwind.
