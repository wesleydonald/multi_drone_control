# Thesis result C (card docs/experiments/2026-10-23_paper_method_compare.md): the knobs every claim arm shares, so
# our planner's configs (mode dissipative) and the network's (mode network) differ only in the mode. The network's
# switches are not passed in the dissipative graph. Flies only once the card's critic has passed net_hold_carry and
# net_twin_geometry; the as-ported smoke runs fly configs/rig/drop_and_land_hold5.yaml instead.
# the B baselines' knobs (configs/rig/drop_and_land_hold5.yaml): detection, the step-out, drop and land, the 5 s hold
detach_detect_m: 0.06
detach_step_out_m: 0.5
drop_on_loss: true
traj_hold_s: 5.0
# the network's plumbing: the hold carried across the hand-over (the path starts when our planner's does), the
# references at the drone centre and the nodes on the measured pivots and rods
net_hold_carry: true
net_twin_geometry: true
