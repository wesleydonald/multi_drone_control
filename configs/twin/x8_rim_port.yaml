# X8, the paper's method through a loss (card docs/experiments/2026-10-30_x8_network_loss.md): the network, our port (net_law port, C's search-best gains) on the rim.
# configs/twin/c_net_portfinal.yaml (the C table's arm, as flown) plus the loss rules below; nothing else changed.
detach_detect_m: 0.06
detach_step_out_m: 0.5
drop_on_loss: true
traj_hold_s: 5.0
net_hold_carry: true
net_twin_geometry: true
diss_c: 12.0
diss_k_slot: 18.0
diss_k_pay: 80.0
diss_k_anchor: 80.0
diss_k_ring: 40.0
diss_ki_load: 0.5
vel_kp_pos: 1.0
vel_kv: 3.0
vel_k_att: 8.0
# X8's loss rules, the same text in every arm of the cell (as X1's sqT cell, Wesley 30 Oct ~15:10, twin only):
# drop_gap_deg 200 flies the T (our planner; inert in the network phase), the trackers' ring-tilt drop at 80 deg
# (only our planner acts on it: the network phase ignores /fleet/drop) and the trackers' 60 deg ring envelope off
# (a fleet disarm in every mode), so the square-to-T transient (57-61 deg for our planner, R2249, R2823) is compared,
# not dropped. The scorer applies the 80 deg rule to every arm offline (the card's loss rule).
drop_gap_deg: 200.0
drop_tilt_deg: 80.0
payload_tilt_envelope: false
