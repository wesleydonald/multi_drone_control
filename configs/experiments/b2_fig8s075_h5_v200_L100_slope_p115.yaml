name: b2_fig8s075_h5_v200_L100_slope_p115
description: 'The 28 Oct payload (RIG-1028-payload; real.yaml): 1.15 kg, magnets at r 0.204, plate faces 0.025 above the pivot, at rest 0.013, inertia estimate ixx 0.024 / izz 0.049, in the _p115 world (tools/make_carry_worlds_p115.py). Thesis baseline B with the 22 Oct settings (decisions 22 Oct; card
  docs/experiments/2026-10-22_velocity_filter.md, bands for both filters): 2 quads, 1 m cables, the figure-8 at size 0.75 (x +-0.75, y +-0.375 m; Wesley 22 Oct evening: the rig''s paths shrink to 0.75 m) after a 5 s hover hold,
  0.2 m/s, the mocap velocity filter slope (the twin flies the rig''s filter). Falsifier (exploratory until the
  card''s claim runs): an abort or drop, or ring rocking that grows over the flight.'
lab_env:
  SIM_MOCAP_VEL_FILTER: 'slope'
  MDC_MOCAP_VEL_DRONES: '0,1'
world: two_rigid_ground_rig_L100_p115.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 2
    attach_azimuths_deg: 0,180
    load_traj: fig_8
    fig8_size: 0.75
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.204
    attach_z: 0.025
    payload_rest_z: 0.013
    pivot_offset_z: -0.04
    load_mass: 1.15
    load_ixx: 0.024
    load_izz: 0.049
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/rig/drop_and_land_hold5.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185
    sim_pack_v0: 23.8
    traj_speed: 0.2
    drop_tilt_deg: 55.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 2
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 2
  n_total: 2
timing:
  duration_s: 146.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 91.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 2.0
      - -4.6
      - 2.9
      look_at:
      - 0.35
      - 0.0
      - 1.1
      hfov_deg: 60.0
      size:
      - 1280
      - 720
