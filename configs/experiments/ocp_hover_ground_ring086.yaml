name: ocp_hover_ground_ring086
description: 'RING PAYLOAD SMOKE (docs/experiments/2026-09-23_ring_payload_world.md). The ground hover
  world regenerated with Te-Jen''s M2A ring (24 segments, 12 magnet plates) at the official 0.86 kg, planner
  told 0.86, launch defaults otherwise. Checks the new payload rests, lifts and hovers like the disc did
  (R0284/R0285 at 1.0 kg: 0.537 m).

  '
world: three_rigid_ground.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: mpc
    num_drones: 3
    load_traj: hover
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    kt_trim: false
    z_ki: 0.0
    start_taut: true
    handover_settle_s: 0.75
    creep_vel: 0.1
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
fleet:
  num_drones: 3
  n_total: 3
timing:
  duration_s: 40.0
  stop_after_abort_s: 8.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 30.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
