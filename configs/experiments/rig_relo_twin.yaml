name: rig_relo_twin
description: 'Exploratory twin check of the rig line relo (results/rig/2026-11-12/scripts/rig_relo.sh; Thu 12 Nov, the
  paper''s moving detach; judged after the run, no bars): the unannounced release on the orbit. The M1 four on the 0.86 kg
  ring and 1 m cables (four_rigid_ground_rig_3915_L100, the final models; typed 330,270,210,90 so /drone_1 is on plate 9,
  as X1''s h4 cell), lift, the 0.3 m circle at 0.125 m/s straight from the top (no hold: the rig line has none, its
  params file cannot carry traj_hold_s), then after one lap (17.1 s of path: the 4 s spin-up and one circumference, the
  ring back at its start point) RELEASE of plate 9 (the joint lets go, the planner is not told: the rig''s magnet OFF by
  hand); the circle runs on with three for 20 s, LAND. The rig line''s detection knobs: the magnet-marker check 4 cm, the
  cable-length check 15 cm; the drop rules at their defaults (min_survivors 3, tilt drop 30 deg), throttle_max 0.95 and
  the 5.3 Hz band-stop as the rig. Read: detection time, ring tilt rise and dip at the release, time to settle, path error
  after, the freed quad''s landing point (inside 1.75 m, clear of the circling carriers). Falsifier: no detection, a
  drop or abort, the circle not continuing on three, or the freed quad within 0.3 m of a carrier.'
world: four_rigid_ground_rig_3915_L100.sdf
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2,3
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 4
    attach_azimuths_deg: 330,270,210,90
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: orbit
    traj_radius: 0.3
    traj_speed: 0.125
    measure_rod_len: true
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.95
    cable_notch_hz: 5.3
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    tip_detect_m: 0.04
    detach_detect_m: 0.15
    departed_land: true
    departed_ground_idle: true
io_launch:
  file: sim_io_launch.py
  args:
    detach: true
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    tether_tips: true
    tether_len: 1.0
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 160.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 3.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 9.0
  do: WAIT_TRAJ           # one lap of the orbit: the 4 s spin-up covers 0.25 m, the rest of the 1.885 m at 0.125 m/s
  arg: 17.1 200
- t: 9.0
  do: RELEASE             # /drone_1/detach only (plate 9): the rig's T4 magnet OFF, the planner not told
  arg: 1
- t: 29.0
  do: LAND                # 20 s on three, the circle running on
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos: [2.0, -4.6, 2.9]
      look_at: [0.35, 0.3, 1.1]
      hfov_deg: 60.0
      size: [1280, 720]
