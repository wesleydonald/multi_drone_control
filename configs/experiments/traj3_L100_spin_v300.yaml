name: traj3_L100_spin_v300
description: 'N2 (Wesley 16 Oct: twin bands on the 1 m worlds before the rig flies them): as traj3_spin_v300
  with 1 m cables (world three_rigid_ground_rig_L100.sdf, cable_len 1.0), the generator rule of the existing traj3_L100_* (LAND 5 s
  later, duration +15 s).'
world: three_rigid_ground_rig_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 3
    attach_azimuths_deg: 0,240,120
    load_traj: spin
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.225
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.86
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/rig/drop_and_land.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187
    sim_pack_v0: 23.8
    traj_speed: 0.3
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 3
  n_total: 3
timing:
  duration_s: 102.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 47.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
