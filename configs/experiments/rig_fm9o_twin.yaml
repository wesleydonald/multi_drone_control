name: rig_fm9o_twin
description: 'Exploratory twin check of the rig line fm9o (results/rig/2026-11-18/scripts/rig_fm9o.sh; Thu 19 Nov, the
  paper''s application on the moving ring; judged after the run, no bars): rig_fm9_twin on the orbit as the rig sheet
  (docs/rig/thu_2026-11-19.md call 2): load_traj orbit, r 0.3 m at 0.125 m/s, traj_hold_s 5.0, attach_pause true (the
  orbit params file attach_m1_1m_m2a_orbit_det15.yaml). The triangle on 3/11/7 with QUAD4 welded on plate 9
  (three_rigid_ground_rig_attach_welded_pickup_L100), the ring at 1.2 m, 5 s hold, the circle; DETACH on the circle at the
  orbit clock 8.1 s as R3696 (3 s unload, PARTNER RELEASE; the circle goes on with three), his TAKEOFF slows it to rest
  over 3 s and it waits there through his pickup of the ball at (1.6, 2.0), the drop into the net (drop_height 0.28,
  max_body_z 2.8, drop on arrival within 8 cm as the rig script''s drop_on_arrival_xy 0.08, line up, full lift, his
  throttle 0.8, battery 0.022) and his re-attach on 9 (low route, approach 0.30, MATCH 0.08 m / 0.5 s, descent hold and
  debounce, descent 3 cm below the plate), our co-motion proof, the fold-in, the circle back at speed; 25 s on four (a lap),
  LAND. contact_rig_orbit is not typed: it lifts a rig-only refusal (the twin flies partner_contact on the orbit without
  it). Not mirrored, as rig_fm9_twin: the small object (his r 0.08 ball), the funnel, the catch radius (10 mm against 25)
  and his rig-only pickup knobs. Nearest twin runs: R3696 (nro''s pause on the orbit), R3711/R3713 (the drop into the
  moving ring, no pause). Read: the circle at rest before his approach and how still it held, the drop into the resting
  ring, re-weld tries, the fold-in, the circle back at speed. Falsifier: no rest before his pickup, no drop into the net,
  no re-weld within 400 s, the circle not resuming, QUAD4 within 0.3 m of a carrier off plate 9''s line, a drop or abort.'
world: three_rigid_ground_rig_attach_welded_pickup_L100.sdf
ball_start: [1.6, 2.0, 0.08]       # tools/make_attach_worlds_L100.py BALL_XY (freed at start by his launch)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: orbit
    traj_radius: 0.3
    traj_speed: 0.125
    traj_hold_s: 5.0
    attach_pause: true
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.2
    throttle_max: 0.95
    cable_notch_hz: 5.3
    drop_tilt_deg: 55.0
    detach_detect_m: 0.15
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    detach_unload_s: 3.0
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    partner_attached: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0]
    contact_attach:=true carry_clearance:=0.25 confirm_pickup_release:=true start_gate_topic:=/partner/release
    mission_mode:=pickup_delivery ring_z:=1.2 commit_backdate:=0.04 tracking_check:=off
    attach_cpp_transit:=false attach_transit_clearance:=0.30 minimum_search_z_m:=2.20 approach_offset_z:=0.30
    attach_twist:=zero match_xy:=0.08 match_dwell:=0.5 climb_speed:=0.3 match_speed:=0.20 descent_abort_speed:=0.35
    descent_hold:=true descent_debounce:=1.0 descent_abort_xy:=0.10 contact_give_up_s:=120 contact_dz:=-0.03
    cpp_authority:=false drop_on_arrival:=true drop_on_arrival_xy:=0.08 lift_full:=true mpc_throttle_max:=0.8
    drop_height:=0.28 max_body_z:=2.8 line_up:=true mpc_battery_comp:=0.022
- t: 2.0
  do: WAIT_PICKUP_FREE    # his launch frees the spawn's ball weld on QUAD4's tip before the creep moves the ring
  arg: 120
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 9.0
  do: WAIT_TRAJ           # the orbit's clock at 8.1 s (5 s hover hold, then the 4 s spin-up), as R3696: on the circle
  arg: 8.1 200
- t: 9.0
  do: DETACH              # /fleet/detach 3: the rig's RViz DETACH on the circle (3 s unload; the circle goes on with three)
  arg: 3
- t: 10.0
  do: WAIT_REWELD         # his TAKEOFF pauses the circle; pickup, drop, re-attach; later events are timed from the re-weld
  arg: 400
- t: 35.0
  do: LAND                # 25 s on four after the re-weld: the fold-in, the circle back at speed, a lap (rig sheet)
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos: [2.6, -4.4, 3.2]
      look_at: [0.0, 0.4, 1.8]
      hfov_deg: 60.0
      size: [1280, 720]
