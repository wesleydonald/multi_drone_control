    load_traj: fig_8
    fig8_size: 0.75
    traj_speed: 0.125
    traj_hold_s: 5.0
    traj_laps: 12
    contact_sim_fig8: true
    attach_pause: true
    attach_pause_at: takeoff
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.95
    cable_notch_hz: 5.3
    drop_tilt_deg: 55.0
    detach_detect_m: 0.15
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.8
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
