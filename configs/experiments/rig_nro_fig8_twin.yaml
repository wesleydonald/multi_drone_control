    carry_clearance:=0.25 confirm_pickup_release:=true start_gate_topic:=/partner/release mission_mode:=floor_join commit_backdate:=0.04
    tracking_check:=off attach_cpp_transit:=false attach_transit_clearance:=0.30 minimum_search_z_m:=2.20 approach_offset_z:=0.30
    attach_twist:=zero match_xy:=0.05 match_dwell:=0.5 climb_speed:=0.3 match_speed:=0.20 descent_abort_speed:=0.35 descent_hold:=true
    descent_debounce:=1.0 descent_abort_xy:=0.05 contact_give_up_s:=120 contact_dz:=-0.03
- t: 2.0
  do: WAIT_PICKUP_FREE
  arg: 120
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 9.0
  do: WAIT_TRAJ
  arg: 16.0 200
- t: 9.0
  do: DETACH
  arg: 3
- t: 10.0
  do: WAIT_REWELD
  arg: 400
- t: 35.0
  do: LAND
