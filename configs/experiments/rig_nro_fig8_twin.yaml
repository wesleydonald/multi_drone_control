name: rig_nro_fig8_twin
description: 'Exploratory twin check (the 13 Nov trials; judged after the run, no bars): rig_nr8.sh, rig_nro.sh on the
  figure-eight: the triangle with QUAD4 welded on 9 flies the figure-eight (0.75 m, 0.125 m/s, 12 laps, ring at 1.0 m); DETACH on
  the figure-eight; his TAKEOFF (gated on the release in the twin, pressed later by hand on the rig) slows the figure-eight to
  rest (attach_pause_at takeoff, as configs/rig/attach_m1_1m_m2a_fig8_det15.yaml); his re-attach on 9; the figure-eight resumes
  on four; 25 s, LAND. As rig_nro_twin (R4234) with the path, the 1.8 m limit and his bands 0.05/0.05 of tomorrow''s script.
  The DETACH at path time 16 s (ring near (0.41, -0.34), heading back up through the centre): the released QUAD4 holds
  world-fixed 0.5 m out and 0.3 m up while the path runs on to his TAKEOFF, and a desk estimate puts carrier 11 within ~0.26 m
  of it horizontally from here (about 1 m from a DETACH at 6-10 s, the +y lobe); WAIT_TRAJ 8.1 is the benign point. Read:
  the closest carrier body and cable to QUAD4 from the DETACH to the rest (horizontal and 3D), the rest before his approach,
  the weld, the path resuming. Falsifier: a carrier passing under the held QUAD4 (horizontal under 0.3 m), no rest before his
  approach, no re-weld within 400 s, the figure-eight not resuming. Not mirrored: the funnel, the rig''s catch radius, his
  rig-only knobs; the twin''s rigid rod lets a centred tip sink into plate 9 at ring 1.0 (R4233, R4243), so a missed weld here
  may be the twin''s.'
world: three_rigid_ground_rig_attach_welded_pickup_L100.sdf
ball_start:
- 1.6
- 2.0
- 0.08
