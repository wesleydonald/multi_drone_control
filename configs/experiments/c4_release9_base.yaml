criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'Exploratory (21 Oct evening, plan_thesis_results_2026-10-21 section 1: Wesley''s ''see what the tilt is''
  on today''s code, no card): the 90 deg square 0/3/6/9 (four_rigid_ground_rig: drone 1 on plate 9), an unannounced hover
  RELEASE of drone 1 at 20 s leaves the T 0/3/6 with plate 3 opposite the gap; drop_on_loss OFF as Tier B G180 (on, the
  gap rule drops the ring at detection), so the last resort is the trackers'' 60 deg fault. LAND 20 s after. This is the
  baseline the chain fix is judged against. Falsifier for the analysis (the plan''s finding 1): the T settles far from ~6-7
  deg (the 0.1 N floor against the plate-3 tether''s weight, R0561/R0562).'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- arg: 1
  do: RELEASE
  t: 20.0
- do: LAND
  t: 40.0
