name: cda_b_nr9tb
description: 'Card docs/experiments/2026-11-05_carriers_down_alone.md (5 Nov; exploratory, one run per arm and scenario, bars written before and judged after the run; rev 3): S4 LAND during his re-attach (released on 9, LAND as he matches the plate, ~7 s before the twin''s re-weld): QUAD4 taken back and landed alone, the carriers wait (rig nr9m_4/5, nr1r_3, fm9y_2); rig LAND path (land_unwind false) with land_rearm_touchdown off, as the rig flies; M2A ring, 1 m links; arm B, the base: land_descend_to_stall on (the rig default since 5 Nov ~15:15), carriers_down_alone off. Copied from lr4a_nr9_u0.yaml on the current tree and links.'
world: three_rigid_ground_rig_attach_welded_pickup_L100.sdf
ball_start: [1.6, 2.0, 0.08]       # tools/make_attach_worlds_L100.py BALL_XY (freed at start; unused by floor_join)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    land_rearm_touchdown: false
    land_descend_to_stall: true
    land_unwind: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    partner_attached: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0]
    contact_attach:=true carry_clearance:=0.25 confirm_pickup_release:=true start_gate_topic:=/partner/release mission_mode:=floor_join
- t: 2.0
  do: WAIT_PICKUP_FREE    # his launch frees the spawn's ball weld on QUAD4's tip before the creep moves the ring
  arg: 120
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: DETACH              # /fleet/detach 3: the rig's RViz DETACH (the planner sends QUAD4's magnet OFF)
  arg: 3
- t: 44.0
  do: LAND                # 24 s after the DETACH: his MATCH_VELOCITY over plate 9 (R3716: PARTNER_RELEASE +6.9 s, CONTACT +29.7, REWELD +31.5 after the DETACH), so LAND takes QUAD4 back
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos: [2.6, -4.4, 3.2]
      look_at: [0.0, 0.4, 1.8]
      hfov_deg: 60.0
      size: [1280, 720]
