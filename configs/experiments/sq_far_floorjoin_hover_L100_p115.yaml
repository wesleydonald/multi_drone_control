name: sq_far_floorjoin_hover_L100_p115
description: 'Card 2026-10-28_attach_ambitious, Revision 3 avoidance demo, one variable against A0 (sq_floorjoin_hover_L100_p115, R2843/R2844): QUAD4''s mat on the far side, behind the T at (-1, -1) between the plate-3 and plate-6 carriers (1.02 m from their floor spots; A0 (0, 1.4) beside plate 9), its arm laid out away from the ring (the magnet on the floor at (-1.706, -1.706), 1.00 m from the nearest carrier''s cable; the body at yaw 0, the arm''s pose turned 135 deg): sq_far_rigid_ground_rig_attach_pickup_L100_p115.sdf (tools/make_attach_layout_worlds_p115.py --spawn far). His floor_join climbs straight up over the mat (his TAKEOFF start is the measured ground pose, no parameter) and his C++ transit (attach_cpp_transit, default on) plans from there to above plate 9 round the carriers. At A0''s transit height (the tip 0.25 m above the carriers'' bodies) the planner may clear them from above; with the V1(0.30) transit it has to go round. Everything else as A0: the 1.15 kg payload (RIG-1028-payload) in the _p115 square attach world, his ring model geometry:=rig_twin_L100_p115, throttle_max 0.9, the slope filter on the carriers (the newcomer keeps ema), no params_file, carry_clearance 0.25; carriers on plates 0/3/6, QUAD4 (Tejen''s controller, floor_join) joins plate 9. Exploratory. Falsifier (Revision 3 avoidance-demo bars): no weld within 300 s of his TAKEOFF, an abort or envelope fault, a failed proof, or the rod min (tools/m1_metrics.py flight) under 0.238 m.'
world: sq_far_rigid_ground_rig_attach_pickup_L100_p115.sdf
ball_start: [1.6, 2.0, 0.08]       # tools/make_attach_worlds_L100.py BALL_XY (unused by floor_join; the runner checks it)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.204
    attach_z: 0.025
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 1.15
    load_ixx: 0.024
    load_izz: 0.049
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.013
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.9
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 0,90,180
    attach_x_offset: 0.0
    attach_y_offset: 0.204
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.037
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100_p115 plate:=9 carrier_azimuths_deg:=[0.0,90.0,180.0]
    contact_attach:=true carry_clearance:=0.25 confirm_pickup_release:=true mission_mode:=floor_join
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_WELD           # our co-motion confirmation; later events are timed from it
  arg: 300
- t: 30.0
  do: LAND                # 10 s on four after the confirmation, as the rig sheet
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: true            # rendered after the run (the stack is down); A0 recorded, render off
  cameras:
    baseline:
      pos: [2.6, -4.4, 3.2]
      look_at: [0.0, 0.4, 1.8]
      hfov_deg: 60.0
      size: [1280, 720]
    far_top:              # high, from +x -y: the far mat (-1, -1) and laid-out arm, the carriers, the route to plate 9
      pos: [0.9, -2.6, 6.6]
      look_at: [-0.35, -0.25, 1.3]
      hfov_deg: 55.0
      size: [1280, 720]
