# Copy of configs/experiments/sq_floorjoin_hover_L100_p115_noxy.yaml with the low route (Wesley 5 Nov: QUAD4 never over the carriers, his rule of 29 Oct); the source stays (registry rows cite it).
name: sq_floorjoin_hover_L100_p115_noxy_low
description: 'Low-route copy of sq_floorjoin_hover_L100_p115_noxy (Wesley 5 Nov): the base square floor-join flies the low route, typed as sq_floorjoin_hover_L100_p115_v1a30s types it: attach_transit_clearance 0.30 (the C++ transit ends with the tip 0.30 m above plate 9), minimum_search_z_m 2.327 (his search floor following it), approach_offset_z 0.30, and his swing envelope max_swing_angle_rad 0.02 (without it his carriers'' tether boxes cover the low transit end: R2846 stalled; R2849/R2850 joined with it). QUAD4''s planned body heights 2.33 / 2.38 m (the source flew the over route at 3.20 / 3.25 m, above the 2.6 m ceiling). Was: Final-tree claim copy of sq_floorjoin_hover_L100_p115 (docs/claim_batch_2026-11-07.md): the final-tree re-fly (X11, 4.3 joins) of sq_floorjoin_hover_L100_p115: the carriers lift a T (plates 0/3/6) until QUAD4 joins on 9, so int_k_xy 0 is typed by Wesley''s fallback of 31 Oct 17:16 (decisions.md: int_k_xy 0 typed in the cells that form a T, now that the rod-in-plan fix was reversed on 4 Nov ~23:00); the sideways integral is off for the whole flight, so a steady sideways offset is not cancelled (on the new links R3701: the T level within 1.8 deg, 47 mm off its point; with it on R3699/R3700 leaned 16.5-17.8 deg). PENDING Wesley''s word (the rule''s text names T cells left by a release). Was: Baseline of card 2026-10-28_attach_ambitious (every new switch off). The 28 Oct payload (RIG-1028-payload): 1.15 kg, magnets at r 0.204, plate faces 0.025 above the pivot, at rest 0.013, inertia estimate ixx 0.024 / izz 0.049, in the _p115 square attach world (tools/make_attach_layout_worlds_p115.py); his ring model geometry:=rig_twin_L100_p115; throttle_max 0.9 (the T 0/3/6 loads like a pair, R2839-R2842); the slope filter on the carriers (the newcomer keeps ema); no params_file (chain_pair_attach_1m.yaml stalled his planner in R2830/R2831). sq_floorjoin_hover_L100 (R2825) otherwise: carriers on rig plates 0/3/6 (the T of the square); QUAD4 (Tejen''s controller, floor_join) joins plate 9 -> the square. Exploratory. Falsifier: no weld within 300 s of his TAKEOFF, an abort, or a clearance under 0.25 m.'
world: sq_rigid_ground_rig_attach_pickup_L100_p115.sdf
ball_start: [1.6, 2.0, 0.0125]       # tools/make_attach_worlds_L100.py BALL_XY, the plate (unused by floor_join; the runner checks it)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    int_k_xy: 0.0                # the T (plates 0/3/6) before the join: the sideways integral off (fallback of 31 Oct 17:16)
    attach_radius: 0.204
    attach_z: 0.025
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 1.15
    load_ixx: 0.024
    load_izz: 0.049
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.013
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.9
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 0,90,180
    attach_x_offset: 0.0
    attach_y_offset: 0.204
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.037
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100_p115 plate:=9 carrier_azimuths_deg:=[0.0,90.0,180.0]
    contact_attach:=true carry_clearance:=0.25 confirm_pickup_release:=true mission_mode:=floor_join
    attach_transit_clearance:=0.30 minimum_search_z_m:=2.327 approach_offset_z:=0.30
    max_swing_angle_rad:=0.02
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_WELD           # our co-motion confirmation; later events are timed from it
  arg: 300
- t: 30.0
  do: LAND                # 10 s on four after the confirmation, as the rig sheet
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos: [2.6, -4.4, 3.2]
      look_at: [0.0, 0.4, 1.8]
      hfov_deg: 60.0
      size: [1280, 720]
