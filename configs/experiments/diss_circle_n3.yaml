name: diss_circle_n3
description: "(2026-09-23: load_mass rescaled to the official 0.86 kg ring payload now in every world;\
  \ earlier runs of this config flew the 0.6 kg disc.) PART A STAGE T BASELINE (THESIS_PLAN §12.1). Three\
  \ drones carry the payload on the dissipative network through a circle of radius 0.5 m at 0.6 m/s peak\
  \ — the exact configuration DISSIPATIVE_TRACKING_ISSUE.md §2 recorded its stage split from.\nThis is\
  \ the run every T1–T4 result is measured against. Nothing is asserted about the numbers: the point is\
  \ to establish what the CURRENT plant does, and asserting the old values would decide the question in\
  \ advance. Only the two things that mean \"this run is not evidence\" are checked — the payload must\
  \ not fall through the floor, and the fleet must not abort.\nREAD BEFORE QUOTING A PHASE LAG FROM THIS.\
  \ `load_traj: circle` is ONE EASED SWEEP, not continuous laps: LoadTrajectory._circle_theta stretches\
  \ the duration so PEAK tangential speed equals traj_speed, giving T = 1.875·2π·r/v ≈ 9.8 s here, after\
  \ which the planner latches the descent. So:\n  * `traj_speed: 0.6` is a PEAK, reached at the half-way\
  \ point, not a constant speed.\n  * radius_ratio is well defined — the commanded path sits at r for\
  \ the whole sweep.\n  * phase_lag_s has only one period to cross-correlate over, so it is noisier here\n\
  \    than on the synthetic circles tools/test/test_metrics.py pins it against. Report\n    it with the\
  \ repeat range (§9.2), never as a single run's value.\n\nThe network is engaged for the whole flight\
  \ by dissipative_only_launch.py's auto_network_handover — dissipative_launch.py alone would fly the\
  \ OCP and never enter the network phase, which is the mistake documented in CURRENT_STATE.md §10.\n"
world: three_rigid_ground.sdf
launch:
  package: controller_quad_load
  file: dissipative_only_launch.py
  args:
    num_drones: 3
    load_traj: circle
    traj_speed: 0.6
    traj_radius: 0.5
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    terminal_vel_ref: false
    kt_trim: false
    z_ki: 0.0
    start_taut: true
    handover_settle_s: 0.75
    creep_vel: 0.1
io_launch:
  file: rviz_quad_load_launch.py
  args:
    num_drones: 3
fleet:
  num_drones: 3
  n_total: 3
timing:
  duration_s: 75.0
  stop_after_abort_s: 8.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 68.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
