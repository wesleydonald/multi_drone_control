name: traj3d_fig8_v300_d015
description: 'Exploratory (plan 2026-10-15, inventory N4): traj3_fig8_v300 with 15 ms of extra command delay in the sim Betaflight
  bridge (SIM_CMD_DELAY_S, run through ~/handoff_2026-10-14/delay_batch.py): how much of the rig''s latency the 0.3 m/s carry
  tolerates before the rig''s speed ladder. Baseline traj3_fig8_v300 (R1725/R1740 or R1728/R1743, 0 ms). Falsifier: a growing
  bob, an abort or a drop.'
world: three_rigid_ground_rig.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 3
    attach_azimuths_deg: 0,240,120
    load_traj: fig_8
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 0.55
    attach_radius: 0.225
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.86
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/rig/drop_and_land.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187
    sim_pack_v0: 23.8
    traj_speed: 0.3
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 3
  n_total: 3
timing:
  duration_s: 81.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 36.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
lab_env:
  SIM_CMD_DELAY_S: '0.015'
