name: s8_fig8laps_h5_v200_R50_L100_it5
description: 'Scalability S, proposed case 7, its base (card 2026-10-23_scalability, ''More complex cases (proposed 23 Oct,
  for Wesley)'', ### 7; traj_laps and traj_lap_hold_s built 23 Oct, default off, twin only; critic waived by Wesley 23 Oct;
  not flown, no bar frozen; 5 SQP iterations). The 8-quad carry on the figure-8 at size 0.5 and 0.2 m/s, 9 laps of 19.2 s
  (traj_laps 9), the path held 3 s at each lap end but the last (traj_lap_hold_s 3.0, ''lap k done''); LAND 2 s after the
  last lap (WAIT_TRAJ lap 9). One variable against s8_fig8_h5_v200_R50_L100_it5: the laps (9, not 1, with their lap-end holds).
  Falsifier (exploratory): an abort, a drop, a failed solve, more than 1 % late planner ticks (void), a lap-end hold missing,
  twice or not 3 s, the clock running back, or a lap''s clock-free path error over the one-lap base''s by more than max(25
  %, 3 mm).'
lab_env:
  SIM_MOCAP_VEL_FILTER: ema
  MDC_MOCAP_VEL_DRONES: 0,1,2,3,4,5,6,7
world: eight_rigid_ground_rig_R50_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 8
    attach_azimuths_deg: 0,315,270,225,180,135,90,45
    load_traj: fig_8
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.5
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.9
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/twin/s_chain_pair.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187,0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
    traj_speed: 0.2
    load_ixx: 0.113025
    load_izz: 0.22581
    plan_sqp_iters: 5
    plan_fast_refs: true
    fig8_size: 0.5
    traj_hold_s: 5.0
    traj_laps: 9
    traj_lap_hold_s: 3.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 8
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 8
  n_total: 8
timing:
  duration_s: 450.0
  ready_timeout_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 90
- t: 9.0
  do: WAIT_TRAJ
  arg: lap 9 400
- t: 11.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    wide:
      pos:
      - 3.6
      - -6.2
      - 3.8
      look_at:
      - 0.0
      - 0.0
      - 1.1
      hfov_deg: 62.0
      size:
      - 1280
      - 720
