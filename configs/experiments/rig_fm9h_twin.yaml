name: rig_fm9h_twin
description: 'Exploratory twin check of the rig line fm9h (results/rig/2026-11-18/scripts/rig_fm9h.sh; fm9''s fallback when
  the pickup struggles; judged after the run, no bars): his mission_mode delivery_rejoin in the held world
  (three_rigid_ground_rig_attach_held_pickup_L100, the final models: QUAD4 free on the floor at (0, 1.4), the ball welded
  on its magnet tip at (0, 2.4) from spawn). The triangle on 3/11/7 lifts the ring to 1.2 m; no detach (QUAD4 starts off
  the ring, as on the rig: one magnet cannot hold the object and plate 9); his loaded climb, the drop into the net
  (drop_height 0.28, max_body_z 2.8, drop on arrival within 8 cm as the rig script''s drop_on_arrival_xy 0.08, line up, full lift, his throttle 0.8, battery 0.022), his re-attach
  on 9 on the rig''s approach (low route, approach 0.30, MATCH 0.08 m / 0.5 s, descent hold and debounce, descent 3 cm
  below the plate), our co-motion proof, 10 s on four, LAND. Our side as the rig: tilt drop 55 deg, loss check 15 cm,
  throttle_max 0.95, the 5.3 Hz band-stop. Not mirrored: the rig''s small object (his r 0.08 ball: QUAD4 plans 2.68 / 2.88 m
  against the rig''s 2.56 / 2.76), the funnel, the catch radius (10 mm against 25), his rig-only knobs. The first run of
  delivery_rejoin with the rejoin on 1 m cables (fri30_k1_7, R2905, ended after the drop on the 1.15 kg ring). Falsifier:
  the ball not lifted with QUAD4, no drop into the net, no weld within 400 s, a drop or abort.'
world: three_rigid_ground_rig_attach_held_pickup_L100.sdf
ball_start: [0.0, 2.399, 0.08]     # the ball on QUAD4's tip at spawn (make_attach_worlds held variant)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.2
    throttle_max: 0.95
    cable_notch_hz: 5.3
    drop_tilt_deg: 55.0
    detach_detect_m: 0.15
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0]
    contact_attach:=true carry_clearance:=0.25 mission_mode:=delivery_rejoin ring_z:=1.2 commit_backdate:=0.04
    tracking_check:=off attach_cpp_transit:=false attach_transit_clearance:=0.30 minimum_search_z_m:=2.20
    approach_offset_z:=0.30 attach_twist:=zero match_xy:=0.08 match_dwell:=0.5 climb_speed:=0.3 match_speed:=0.20
    descent_abort_speed:=0.35 descent_hold:=true descent_debounce:=1.0 descent_abort_xy:=0.10 contact_give_up_s:=120
    contact_dz:=-0.03 cpp_authority:=false drop_on_arrival:=true drop_on_arrival_xy:=0.08 lift_full:=true mpc_throttle_max:=0.8 drop_height:=0.28
    max_body_z:=2.8 line_up:=true mpc_battery_comp:=0.022
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_WELD           # his loaded climb, the drop and the attach from the air: the first ring weld of QUAD4
  arg: 400
- t: 30.0
  do: LAND                # 10 s on four after the weld, as the rig sheet
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos: [2.6, -4.4, 3.2]
      look_at: [0.0, 0.4, 1.8]
      hfov_deg: 60.0
      size: [1280, 720]
