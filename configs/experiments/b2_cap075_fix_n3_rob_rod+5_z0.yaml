name: b2_cap075_fix_n3_rob_rod+5_z0
description: 'Thesis T9 (docs/thesis_figure_plan.md): robustness, the controller told {''cable_len'': 0.6} (world:
  0.86 kg, 0.55 m rods, attach r 0.225), z_ki 0.0, box 0, land_unwind + ramp + idle.'
world: three_rigid_ground_rig.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: mpc
    num_drones: 3
    load_traj: hover
    cable_len: 0.6
    attach_radius: 0.225
    attach_z: 0.02
    payload_rest_z: 0.02
    load_mass: 0.86
    drone_mass: 0.55
    target_z: 1.0
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    z_ki: 0.0
    z_i_max: 0.15
    z_i_gate: 0.25
    start_taut: false
    handover_elev_deg: 45.0
    handover_settle_s: 1.0
    creep_vel: 0.2
    lift_ramp_vel: 0.1
    pretension_s: 3.0
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    pivot_offset_z: -0.04
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187
    sim_pack_v0: 23.8
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    x0_relax_frac: 0.0
    land_ff_ramp: true
    ground_idle: true
    land_unwind: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 3
  n_total: 3
timing:
  duration_s: 120.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 48.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
  hold_window_s: 20.0
  max_planner_solve_fail: 1
  max_hold_z_err_m: 0.05
  max_heave_pp_m: 0.03
  max_payload_tilt_deg: 5.0
  max_hold_tilt_mean_deg: 2.0
mis_seed: true
