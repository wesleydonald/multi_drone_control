name: partner_ground_probe
description: 'Diagnostic: his partner launch with the fleet grounded (no ARM), to stack-dump his MPC (R0599/R0606:
  control loop and arm service silent).'
world: old_worlds/three_attach_partner.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: attach
    num_drones: 3
    reserved_attach: 1
    start_taut: true
    load_traj: orbit
    traj_speed: 0.2
    traj_radius: 0.5
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    attach_azimuths_deg: 330,90,210
    attach_central: false
    diss_balanced_tensions: true
    attach_handout: true
    attach_t_handout: 12.0
    attach_x_offset: 0.0
    attach_y_offset: -0.25
    attach_elev_deg: 65.0
    attach_traj_hold_s: 10.0
    attach_traj_hold_mode: timed
    control_mode: velocity_after_handover
    vel_ki: 0.0
    diss_ki_load: 1.0
    enable_obstacle_avoidance: false
    kt_trim: true
    z_ki: 0.4
    reconfig_mode: ocp
    safety_ref_timeout_s: 4.0
    pose_timeout_s: 3.0
    attach_cable_len: 0.49
    partner: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 120.0
  stop_after_abort_s: 8.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py
