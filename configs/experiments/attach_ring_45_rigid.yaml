name: attach_ring_45_rigid
description: >
  WELD-VARIANT LADDER, step 3 of 3. `rod` with arm_to_magnet_tip FIXED. The tip is already
  welded rigidly to the payload, so making this joint fixed too means the arm transmits a
  MOMENT into the load.

  This is the configuration sub-claim N3 actually describes ("reconfiguration under a
  rigid, moment-transmitting attachment, which the tension-only cable formulation of both
  reference papers does not cover") and which NO world in the repo currently contains.

  It brackets the hypothesis from the opposite side to seg2: if rigid is much worse than
  rod, joint stiffness matters and N3 is a genuinely harder problem than what has been
  flown. If rigid ~= rod, the weld is not the lever in either direction.

world: three_attach_rigid.sdf

launch:
  package: controller_quad_load
  file: three_attach_launch.py
  args:
    num_drones: 3
    reserved_attach: 1
    attach_central: false
    diss_balanced_tensions: true
    attach_handout: true
    attach_t_handout: 12.0
    attach_x_offset: -0.08
    attach_y_offset: 0.0
    attach_elev_deg: 45.0
    enable_obstacle_avoidance: false
    load_traj: hover
    cable_len: 0.5
    load_mass: 0.4
    target_z: 0.6

fleet:
  num_drones: 3
  n_total: 4

timing:
  duration_s: 70.0
  # WALL seconds, and generous: this is the only wall-clock deadline in the runner,
  # and acados compiles four solvers behind it on a cold build.
  ready_timeout_s: 420.0
  pose_timeout_s: 2.0

events:
  - {t: 3.0,  do: ARM}
  - {t: 6.0,  do: TAKEOFF}
  # Let the tethered fleet settle into a taut hover at target_z before the newcomer is
  # allowed to approach. Welding into a formation that is still rising confounds the
  # takeoff transient with the attach transient, which is the whole quantity of interest.
  - {t: 25.0, do: MAGNET, arg: 'ON'}
  - {t: 65.0, do: LAND}

criteria:
  require_weld: true
  min_payload_z: 0.02
  # A fleet abort is expected to be INFORMATIVE here rather than disqualifying: if the
  # fixed-kT capsize reproduces in Gazebo, the fleet disarms and that IS the result.
  forbid_abort: false
