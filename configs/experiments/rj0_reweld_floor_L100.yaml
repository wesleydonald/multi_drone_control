criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'Card 2026-10-23_rejoin_departed E0, re-weld smoke (critic B1/B2; reference.md: "ON cannot
  re-weld"): the square on the floor, plate 9''s tether released (RELEASE 1: /drone_1/detach) and re-welded
  where it lies (GZ_PUB /drone_1/attach) before ARM; then the square lifts and hovers 20 s on it. rejoin_departed
  only bridges and logs the joint state. Proposed falsifier: no JOINT_DETACHED then JOINT_ATTACHED row
  within 2 s of its message, no LIFTED, an UNANNOUNCED DETACH, ring tilt over 2 deg in the hover (R2312
  before its detach: 0.19 deg peak), a drop or abort.'
events:
- arg: 1
  do: RELEASE
  t: 1.0
- arg: /drone_1/attach
  do: GZ_PUB
  t: 2.0
- do: ARM
  t: 4.0
- do: TAKEOFF
  t: 7.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 9.0
- do: LAND
  t: 35.0
fleet:
  n_total: 4
  num_drones: 4
io_launch:
  args:
    detach: true
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    tether_tips: true
    tether_len: 1.0
  file: sim_io_launch.py
launch:
  args:
    rejoin_departed: true
    departed_land: false
    attach_azimuths_deg: 0,270,180,90
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    detach_unload_s: 3.0
    load_traj: hover
    measure_rod_len: true
    mode: dissipative
    num_drones: 4
    params_file: /home/wesley/multi_drone_control/configs/rig/chain_pair_noxy.yaml
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    departed_ground_idle: true
  file: sim_control_launch.py
  package: bringup
name: rj0_reweld_floor_L100
timing:
  duration_s: 120.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
world: four_rigid_ground_rig_L100.sdf
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 2.0
      - -4.6
      - 2.9
      look_at:
      - 0.35
      - 0.0
      - 1.1
      hfov_deg: 60.0
      size:
      - 1280
      - 720
