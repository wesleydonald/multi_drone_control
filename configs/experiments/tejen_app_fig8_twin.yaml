name: tejen_app_fig8_twin
description: 'Te-Jen''s application demonstration (Wesley 11 Nov, for Te-Jen''s individual paper; card docs/experiments/2026-11-11_tejen_app_demos.md; simulation, not real-world validation; no bars, judged after the runs): QUAD1-3 on plates 3/11/7 lift the 0.86 kg ring to 1.2 m on 1 m cables; QUAD4 takes off from the floor, picks up the object (his r 0.08 ball at (1.6, 2.0)), carries it to the ring, drops it into the net (settle drop, release 0.03 m) and attaches on plate 9 with his contact attach (bands 0.08/0.10 on the moving cases, Wesley 11 Nov after R4255: QUAD4 trailed the plate by 5 cm at 0.2 m/s; give-up 120 s as the rig; his attach lead time 0 (0.4 s flown in R4271-R4274; back to 0, Wesley 11 Nov 23:45, after R4273/R4274 missed at 0.125 m/s); LAND 10 s after the weld. The ring''s commanded motion never pauses. Case 3 of 3: the ring flies a 1.0 m figure-eight (x +-1.0, y +-0.5 m) at 0.125 m/s (Wesley 11 Nov 23:05 after every 0.2 m/s attach missed), repeated laps (each lap from rest at the crossing point to rest there).'
world: three_rigid_ground_rig_attach_pickup_L100.sdf
ball_start:
- 1.6
- 2.0
- 0.08
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: fig_8
    contact_sim_fig8: true
    fig8_size: 1.0
    traj_speed: 0.125
    traj_laps: 12
    traj_hold_s: 5.0
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.2
    throttle_max: 0.95
    cable_notch_hz: 5.3
    drop_tilt_deg: 55.0
    detach_detect_m: 0.15
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 700.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0] contact_attach:=true
    carry_clearance:=0.25 confirm_pickup_release:=true mission_mode:=pickup_delivery ring_z:=1.2
    commit_backdate:=0.04 tracking_check:=off attach_cpp_transit:=false attach_transit_clearance:=0.30 minimum_search_z_m:=2.20
    approach_offset_z:=0.30 attach_twist:=zero match_xy:=0.08 match_dwell:=0.5 climb_speed:=0.3 match_speed:=0.20 descent_abort_speed:=0.35
    descent_hold:=true descent_debounce:=1.0 descent_abort_xy:=0.10 contact_give_up_s:=120 contact_lead:=0.0 contact_dz:=-0.03 cpp_authority:=false
    lift_full:=true mpc_throttle_max:=0.8 drop_height:=0.48 max_body_z:=2.8 line_up:=true mpc_battery_comp:=0.022 drop_release:=0.03
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 9.0
  do: WAIT_WELD
  arg: 280
- t: 19.0
  do: LAND
criteria:
  require_weld: true
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    wide:
      pos:
      - 3.6
      - -3.0
      - 3.2
      look_at:
      - 0.45
      - 0.85
      - 1.0
      hfov_deg: 70.0
      size:
      - 1920
      - 1080
    top:
      pos:
      - 0.3
      - 0.55
      - 4.8
      look_at:
      - 0.3
      - 0.56
      - 0.0
      hfov_deg: 60.0
      size:
      - 1080
      - 1080
