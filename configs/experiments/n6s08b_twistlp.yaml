name: n6s08b_twistlp
description: 'Exploratory (zero-twist critic F2): as n6s08b_twist0 (0.8 Hz shake at the rig''s amplitude) with attach_twist:=lowpass (0.5 Hz). Read as the rev-3 rows (R1821-R1823).'
world: three_rigid_ground_rig_attach_pickup_push.sdf
ball_start:
- 1.0
- 1.6
- 0.08
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
