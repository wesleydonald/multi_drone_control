name: n6_arm_twist0
description: 'Plan 2026-10-15 N6 arm (exploratory): a zero attachment twist (attach_twist:=zero, card rev 2), with the ring
  shaken by a 0.17 N m square-wave torque about world x at 1.8 Hz for 40 s from his APPROACH_ABOVE_TARGET (the pilots R1766-R1768
  put the rig''s bounce between 0.10 (0.36 cm) and 0.20 N m (1.00 cm, no contact): 0.17 for the rig''s 0.8 cm plate bounce,
  RIG-1015-a1) and the rig''s match gate (5 cm, 0.15 m/s). Read: time from MATCH to the descent, contacts, contact to proof,
  false proofs, the weld; the tip''s bounce against the plate in his DESCEND/ATTACH_READY.'
world: three_rigid_ground_rig_attach_pickup_push.sdf
ball_start:
- 1.0
- 1.6
- 0.08
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    attach_cable_len: 0.59
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0] pickup_lift_height:=2.3
    minimum_search_z_m:=2.7 drop_approach_clearance:=1.35 contact_attach:=true confirm_pickup_release:=true mission_mode:=floor_join
    match_xy:=0.05 match_speed:=0.15 attach_twist:=zero
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_LOG
