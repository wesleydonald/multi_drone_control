# Copy of configs/experiments/x8_hub_ours.yaml with int_k_xy 0 (staged 7 Nov, installed by claim1106_x1old.sh)
name: x8_hub_ours_noxy
description: 'X8 hub, our arm with int_k_xy 0 (Wesley 7 Nov: both cells under the 5 Nov T rule; configs/twin/x8_hub_ours_noxy.yaml = x8_hub_ours.yaml + int_k_xy 0). Was: X8 (claim arm), the paper''s method through a loss, card docs/experiments/2026-10-30_x8_network_loss.md (bars
  PROPOSED, not frozen): 4 quads hover on world C (four_rigid_ground_rig_hubcom_L100: every rod on a 1 mm hub at the ring''s
  centre of mass, hinged at its drone''s centre), typed 0,270,180,90, 0.86 kg ring, 1 m cables; unannounced RELEASE of /drone_1
  (plate 9) 25 s after the ring passes 0.95 m (~22 s after the network''s hand-over), LAND 30 s after it. Arm ours: our planner:
  the release found by its detector (a cable 6 cm over its length for 2 ticks), the OCP resized to the T, the leaver stepped
  out and landed. Otherwise c_pl_hubcom_hover_L100 (the C table''s cell) with X8''s loss rules (configs/twin/x8_hub_ours_noxy.yaml)
  and the slope filter. Falsifier (L1, the plan''s, PROPOSED): on world C the port''s mean excursion <= ours''.'
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2,3
world: four_rigid_ground_rig_hubcom_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 4
    attach_azimuths_deg: 0,270,180,90
    load_traj: hover
    traj_speed: 0.2
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.001
    attach_z: 0.0
    payload_rest_z: 0.02
    pivot_offset_z: 0.0
    load_mass: 0.86
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/twin/x8_hub_ours_noxy.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 4
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 160.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.95 90
- t: 33.0
  do: RELEASE
  arg: 1
- t: 63.0
  do: LAND
criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 2.0
      - -4.6
      - 2.9
      look_at:
      - 0.35
      - 0.0
      - 1.1
      hfov_deg: 60.0
      size:
      - 1280
      - 720
