name: t15x_fig8_timeout_trial_s14
description: '15 Nov C++ exit twin wiring check (handoff 15 Nov, plan v2 section 7; exploratory, wiring only, not timing): the 7 s preparation timeout with his backend frozen from the clearance''s completion and his twin supervisor''s backend-status limit 120 s for this run (R4533 disarmed at 15 s): the failure, the cancel blend to the live ring-following reference, his LAND 10 s later (the escape). The exit trial line: return_after_drop:=cpp exit_handoff:=moving max_body_z:=3.2 cpp_max_z:=3.2 on t15_fig8_s9_cpp_sw3_spl2_retdirect_endless_twin. Falsifier: no AT_START or LANDED_DISARMED, a stationary seed, a reference step over 5 cm at a switch, QUAD4 over 3.2 m, an abort.'
world: three_rigid_ground_rig_attach_held_pickup_L100.sdf
ball_start:
- 0.0
- 2.399
- 0.08
