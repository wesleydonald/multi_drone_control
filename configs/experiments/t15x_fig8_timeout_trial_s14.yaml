  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 700.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0] contact_attach:=true
    carry_clearance:=0.25 mission_mode:=delivery_rejoin ring_z:=1.2 commit_backdate:=0.04 tracking_check:=off attach_cpp_transit:=false
    attach_transit_clearance:=0.30 minimum_search_z_m:=2.20 approach_offset_z:=0.30 attach_twist:=zero match_xy:=0.05 match_dwell:=0.5
    climb_speed:=0.3 match_speed:=0.20 descent_abort_speed:=0.35 descent_hold:=true descent_debounce:=1.0 descent_abort_xy:=0.05
    contact_give_up_s:=120 contact_dz:=-0.03 lift_full:=true mpc_throttle_max:=0.8 drop_height:=0.48 max_body_z:=3.2 mpc_battery_comp:=0.022
    drop_release:=0.03 max_swing_angle_rad:=0.0524 spline_time_factor:=2 cooperative_tracking_half_m:=0.06 swing_envelope:=outer_octagon
    target_time_iterations:=30 cpp_max_z:=3.2 return_after_drop:=cpp exit_handoff:=moving cpp_world_refresh:=0.2 cpp_splice:=0.30 prepare_settle_speed:=0.20 prepare_settle_accel:=0.8 supervisor_status_timeout_s:=120
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_LOG
  arg: 500 HIS:C.. exit. clearance complete
- t: 20.0
  do: SIGNAL
  arg: STOP dynamic_planner_transfer_backend
- t: 21.0
  do: WAIT_LOG
  arg: 120 HIS:C.. exit hand-off FAILED
- t: 23.0
  do: SIGNAL
  arg: CONT dynamic_planner_transfer_backend
- t: 31.0
  do: HIS_LAND
- t: 40.0
  do: WAIT_LOG
  arg: 200 PHASE:LANDED_DISARMED
- t: 41.0
  do: LAND
