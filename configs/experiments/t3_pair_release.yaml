criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'Card 2026-10-21_chain_release, arm 2 (tomorrow''s rig step): three quads in the T, plates 0/3/6, from the
  floor (three_rigid_ground_rig_T: drone 1 on plate 3), hover, an unannounced RELEASE of drone 1 at 30 s (after ~20 s at
  1.0 m) leaves the opposite pair 0/6 (configs/rig/chain_pair.yaml), pair hover, LAND 20 s after. Bars (frozen in the card):
  no drop or abort, ring tilt peak < 30 deg, the T''s last 10 s before the release < 10 deg, the pair''s roll rocking <
  15 deg peak-to-peak over its last 10 s, every quad lands.'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- arg: 1
  do: RELEASE
  t: 30.0
- do: LAND
  t: 50.0
fleet:
  num_drones: 3
  n_total: 3
io_launch:
  args:
    detach: true
    num_drones: 3
    sim_pack_v0: 23.8
    sim_thrust_map: rig
  file: sim_io_launch.py
launch:
  args:
    departed_land: true
    attach_azimuths_deg: 0,90,180
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    mode: dissipative
    num_drones: 3
    params_file: /home/wesley/multi_drone_control/configs/rig/chain_pair.yaml
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    departed_ground_idle: true
  file: sim_control_launch.py
  package: bringup
name: t3_pair_release
timing:
  duration_s: 120.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
world: three_rigid_ground_rig_T.sdf
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 1.8
      - -3.9
      - 2.5
      look_at:
      - 0.35
      - 0.0
      - 0.9
      hfov_deg: 60.0
      size:
      - 1280
      - 720
