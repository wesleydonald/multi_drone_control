criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'Card 2026-10-23_rejoin_departed E4 neighbour (staging on a path, critic M3): the square
  at 1 m, plate 0 (+x) soft-detached in a 30 s hover hold before one figure-8 lap (fig8_size 0.9, 0.2
  m/s), drone 0 staged through the lap (clamped 1.6 m at the +x lobe), ATTACH 0 mid-lap (refused: the
  path runs), LAND after the lap. Proposed falsifier: no REJOIN_REFUSED for the mid-lap ATTACH; the staged
  drone past +-1.6 m, within 0.6 m of the ring centre or 0.8 m of a carrier body; no STAGED_LEAVES at
  the LAND; a quad not landing; a drop or abort.'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- arg: 0
  do: DETACH
  t: 20.0
- arg: 0
  do: ATTACH
  t: 53.0
- arg: 90 load trajectory complete
  do: WAIT_LOG
  t: 54.0
- do: LAND
  t: 57.0
fleet:
  n_total: 4
  num_drones: 4
io_launch:
  args:
    detach: true
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    tether_tips: true
    tether_len: 1.0
  file: sim_io_launch.py
launch:
  args:
    rejoin_departed: true
    departed_land: false
    attach_azimuths_deg: 0,270,180,90
    attach_radius: 0.225
