name: s8_chain4back_fig8laps_R50_L100_it5
description: 'Scalability S, proposed case 7 (card 2026-10-23_scalability, ''More complex cases (proposed 23 Oct, for Wesley)'',
  ### 7, the plan''s design B at scale; traj_laps and traj_lap_hold_s built 23 Oct, default off, twin only; critic waived
  by Wesley 23 Oct; not flown, no bar frozen; 5 SQP iterations). The chain lap by lap on s8_fig8laps_h5_v200_R50_L100_it5''s
  path (the figure-8 at size 0.5 and 0.2 m/s, 9 laps, held 3 s at each lap end): a lap at 8, then one unannounced release
  per lap at mid-lap (the centre crossing at speed; WAIT_TRAJ lap 1.5, 2.5, 3.5, 4.5: /drone_1, 5, 3, 7) down to 4, the freed
  quads staged in the ring frame (rejoin_departed, departed_land false, io tether_tips), then one rejoin per lap end in its
  hold (ATTACH 0.5 s after ''lap k done'', k 5-8: /drone_7, 3, 5, 1; the rejoin holds the path on through its fold-in) and
  the last lap at 8; LAND 2 s after the last lap. One variable against s8_fig8laps_h5_v200_R50_L100_it5: the chain (four releases
  and four rejoins, with the staging switches they need). Falsifier (exploratory): an abort, a drop, a failed solve, more
  than 1 % late planner ticks (void), a REJOIN REFUSED (''the path is running'' means the lap-end hold was missed: void, not
  a falsification), a refused or timed-out rejoin, a release or rejoin over the card''s chain bars, or the clock running back.'
lab_env:
  SIM_MOCAP_VEL_FILTER: ema
  MDC_MOCAP_VEL_DRONES: 0,1,2,3,4,5,6,7
