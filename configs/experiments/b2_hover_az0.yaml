name: b2_hover_az0
description: 'Exploratory (21 Oct evening, after R2253): b2_hover with the planner''s attach_z 0.0 in the 0.02 world (mis_seed):
  the rig''s model gap (real.yaml attach_z 0.0 while the plates sit ~2 cm above the ring''s centre of mass and the ring
  pose ~3 cm above it). Does the pair rock like the rig''s 21 Oct two-quad flights (11-15 deg p-p) when R2244 (matched)
  held 0.3 deg? Falsifier: rocking under 2 deg p-p means the gap is not the rig''s cause.'
world: two_rigid_ground_rig.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 2
    attach_azimuths_deg: 0,180
    load_traj: hover
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 0.55
    attach_radius: 0.225
    attach_z: 0.0
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.86
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/rig/drop_and_land.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185
    sim_pack_v0: 23.8
    traj_speed: 0.2
    drop_tilt_deg: 55.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 2
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 2
  n_total: 2
timing:
  duration_s: 86.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 35.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 1.8
      - -3.9
      - 2.5
      look_at:
      - 0.35
      - 0.0
      - 0.9
      hfov_deg: 60.0
      size:
      - 1280
      - 720
mis_seed: true
