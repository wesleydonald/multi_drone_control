name: s8_chain4b2b_R50_L100_it5
description: 'Scalability S, proposed case 1, its hover twin (card 2026-10-23_scalability, ''More complex cases (proposed
  23 Oct, for Wesley)''; not flown, no bar frozen; 5 SQP iterations, the claims'' count since Wesley''s 23 Oct answer). s8_chain4back
  with the return back to back: it starts as the last quad leaves (ATTACH /drone_1 0.5 s after the /drone_7 resize line) and
  each next ATTACH comes 1 s after the previous REJOIN WELD (there 20 s), first out first back (/drone_1, 5, 3, 7; there 7,
  3, 5, 1), so each rejoiner flies its approach while the one before it folds in (its 10 s blend). LAND 30 s after the last
  weld, as there. One variable against s8_chain4back_R50_L100_it5: the return''s schedule. Falsifier (exploratory): an abort,
  a drop, a failed solve, more than 1 % late planner ticks (void), a refused or timed-out rejoin, a release over the card''s
  chain bar, or a fold-in tilt over 5 deg.'
lab_env:
  SIM_MOCAP_VEL_FILTER: ema
  MDC_MOCAP_VEL_DRONES: 0,1,2,3,4,5,6,7
world: eight_rigid_ground_rig_R50_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 8
    attach_azimuths_deg: 0,315,270,225,180,135,90,45
    load_traj: hover
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.5
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.9
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: false
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/twin/s_chain_pair.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187,0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
    traj_speed: 0.2
    load_ixx: 0.113025
    load_izz: 0.22581
    plan_sqp_iters: 5
    plan_fast_refs: true
    rejoin_departed: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 8
    sim_thrust_map: rig
    sim_pack_v0: 23.8
    tether_tips: true
    tether_len: 1.0
fleet:
  num_drones: 8
  n_total: 8
timing:
  duration_s: 420.0
  ready_timeout_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 90
- t: 30.0
  do: RELEASE
  arg: 1
- t: 45.0
  do: RELEASE
  arg: 5
- t: 60.0
  do: RELEASE
  arg: 3
- t: 75.0
  do: RELEASE
  arg: 7
- t: 75.1
  do: WAIT_LOG
  arg: 30 DETACH drone 8 \(/drone_7\) \(OCP resize\)
- t: 75.6
  do: ATTACH
  arg: 1
- t: 75.7
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 2
- t: 76.7
  do: ATTACH
  arg: 5
- t: 76.8
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 6
- t: 77.8
  do: ATTACH
  arg: 3
- t: 77.9
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 4
- t: 78.9
  do: ATTACH
  arg: 7
- t: 79.0
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 8
- t: 109.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    wide:
      pos:
      - 3.6
      - -6.2
      - 3.8
      look_at:
      - 0.0
      - 0.0
      - 1.1
      hfov_deg: 62.0
      size:
      - 1280
      - 720
