criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.45
  max_planner_solve_fail: 1
description: 'Appendix re-fly, card docs/experiments/2026-10-16_appendix_refly.md, arm T4-orbit: w4_even_orbit_lf (R1033/R1037) (4-5 Oct) on the freeze stack. Changed: mode mpc -> dissipative (our planner, detach mode); the handover_elev_deg 45 and z_i_max 0.15 pins removed (defaults 60, 0.3). OPTIONAL (Wesley''s word). Four carriers, orbit r 0.5 at 0.125 m/s, even ring. z_ki 0 pin removed too: the table is re-flown on the default controller (model integral), as the traj3 claim.'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- do: LAND
  t: 52.0
fleet:
  n_total: 4
  num_drones: 4
io_launch:
  args:
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
  file: sim_io_launch.py
launch:
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.1
    load_mass: 0.86
    load_traj: orbit
    measure_rod_len: true
    mode: dissipative
    num_drones: 4
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    traj_radius: 0.5
    traj_speed: 0.125
    land_unwind: true
    land_ff_ramp: true
    ground_idle: true
  file: sim_control_launch.py
  package: bringup
name: app_traj4_orbit
timing:
  duration_s: 120.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
world: four_rigid_ground_rig.sdf
