name: basket_circle_L100
description: 'Exploratory (22 Oct overnight, Wesley: his pickup and the basket on 1 m cables): basket_circle with 1 m cables (world
  three_rigid_ground_rig_attach_pickup_L100.sdf, his geometry rig_twin_L100: magnet 1.04 m below QUAD4) and his heights from
  the transit rule (carry_heights in tejen-sync2: the ball''s bottom half a carrier cable above the carriers'' bodies:
  pickup_lift_height 2.49 minimum_search_z_m 3.56 drop_approach_clearance 1.42). Falsifier: no pickup, the ball not in the net after the drop, no weld, or any abort.'
world: three_rigid_ground_rig_attach_pickup_L100.sdf
ball_start: [1.6, 2.0, 0.08]       # tools/make_attach_worlds_L100.py BALL_XY (the 1 m world moves the ball out)
geometry_exempt:
  attach_cable_len: 'as flown (R2306-R2322): QUAD4''s body-to-tip (rod 1.0 + pivot 0.04) typed as its rod, before 22 Oct'
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: orbit
    traj_radius: 0.5
    traj_speed: 0.125
    params_file: /home/wesley/multi_drone_control/configs/rig/traj_hold10.yaml
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    attach_cable_len: 1.04
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0]
    pickup_lift_height:=2.49 minimum_search_z_m:=3.56 drop_approach_clearance:=1.42
    contact_attach:=true confirm_pickup_release:=true
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_WELD
  arg: 420
- t: 28.0
  do: LAND
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
