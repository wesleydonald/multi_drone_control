name: diss_circle_n3_V
description: "(2026-09-23: load_mass rescaled to the official 0.86 kg ring payload now in every world;\
  \ earlier runs of this config flew the 0.6 kg disc.) PART A STAGE V (THESIS_PLAN §12.1). Identical to\
  \ diss_circle_n3.yaml except control_mode:=velocity_after_handover: the OCP owns creep and lift, and\
  \ the velocity loop takes the drones over at the SAME instant the dissipative network takes the references\
  \ over. Compare with:\n\n    tools/compare_runs.py R0054,R0056-R0059 <these ids> --label MPC velocity\n\
  \nWhy this split and not velocity all the way: the velocity loop has no cable term in its feedback path,\
  \ so three independent position servos capsize the load through the lift (R0067-R0069, docs/design/velocity_loop.md\
  \ §8). That is the same boundary dissipative_only_launch.py already documents for the network itself\
  \ — the OCP owns the break-off, and the paper's controller is a transport controller.\nONE VARIABLE\
  \ against the baseline. Nothing else in this file may differ.\nREAD BEFORE QUOTING A PHASE LAG FROM\
  \ THIS. `load_traj: circle` is ONE EASED SWEEP, not continuous laps: LoadTrajectory._circle_theta stretches\
  \ the duration so PEAK tangential speed equals traj_speed, giving T = 1.875·2π·r/v ≈ 9.8 s here, after\
  \ which the planner latches the descent. So:\n  * `traj_speed: 0.6` is a PEAK, reached at the half-way\
  \ point, not a constant speed.\n  * radius_ratio is well defined — the commanded path sits at r for\
  \ the whole sweep.\n  * phase_lag_s has only one period to cross-correlate over, so it is noisier here\n\
  \    than on the synthetic circles tools/test/test_metrics.py pins it against. Report\n    it with the\
  \ repeat range (§9.2), never as a single run's value.\n\nThe network is engaged for the whole flight\
  \ by dissipative_only_launch.py's auto_network_handover — dissipative_launch.py alone would fly the\
  \ OCP and never enter the network phase, which is the mistake documented in CURRENT_STATE.md §10.\n"
world: three_rigid_ground.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: network
    num_drones: 3
    load_traj: circle
    traj_speed: 0.6
    traj_radius: 0.5
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    terminal_vel_ref: false
    control_mode: velocity_after_handover
    kt_trim: false
    z_ki: 0.0
    start_taut: true
    handover_settle_s: 0.75
    creep_vel: 0.1
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
fleet:
  num_drones: 3
  n_total: 3
timing:
  duration_s: 75.0
  stop_after_abort_s: 8.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 68.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
