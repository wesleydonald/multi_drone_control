criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'LIM-c (card docs/experiments/2026-10-22_position_limit.md): c4_detach9_fig8_L100 with the figure-8 at size
  0.75 and the hard DETACH moved to the quad that is outboard at the +x lobe tip (drone 0, plate 0; 22.5 s,
  the tip 7.7 s into the lap), the position limit on at 1.75 m (configs/twin/pos_limit_chain_pair_noxy.yaml).
  Its step-out (or a drop''s) is clamped at 1.65 m inside the 1.2 m clearance circle: the critic''s M1. Pass
  (bars PROPOSED in the card): every freed or dropped quad lands inside 1.65 m and 1.17 m or more from the
  ring, upright (tilt under 30 deg at touchdown).'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- arg: 0
  do: DETACH
  t: 22.5
- do: LAND
  t: 75.0
fleet:
  n_total: 4
  num_drones: 4
io_launch:
  args:
    detach: true
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    tether_tips: true
    tether_len: 1.0
  file: sim_io_launch.py
launch:
  args:
    departed_land: true
    attach_azimuths_deg: 0,270,180,90
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: fig_8
    fig8_size: 0.75
    traj_speed: 0.2
    measure_rod_len: true
    mode: dissipative
    num_drones: 4
    params_file: /home/wesley/multi_drone_control/configs/twin/pos_limit_chain_pair_noxy.yaml
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    departed_ground_idle: true
  file: sim_control_launch.py
  package: bringup
name: lim_c_c4_detach0tip_fig8s075_L100
timing:
