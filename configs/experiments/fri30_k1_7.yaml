name: fri30_k1_7
description: 'Preview of the Fri 30 Oct rig sheet line k1_7 (docs/rig/fri_2026-10-30.md; the drop-off fallback,
  Wesley 30 Oct: "start with the individual quad having the object connected at the start"), flown in the twin (no
  added delay) for its isometric video; exploratory, no claim. fri30_k1_5 with his mission_mode delivery_rejoin: QUAD4
  takes off from its mat already holding the plate (100 x 100 x 25 mm, 0.15 kg) on its magnet tip (the held _p115
  triangle world, tools/make_attach_layout_worlds_p115.py --layout tri), climbs loaded, flies his Python transit
  (cpp_authority false) to the drop point over the ring and drops it into the net, then holds clear (end_after_drop)
  until LAND. The triangle (carriers on plates 3/11/7), the 1.15 kg ring, his ring model geometry:=rig_twin_L100_p115'
world: three_rigid_ground_rig_attach_held_pickup_L100_p115.sdf
ball_start: [0.0, 2.399, 0.0125]     # the plate on QUAD4's tip at spawn (make_attach_worlds.held_pickup_world)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.204
    attach_z: 0.025
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 1.15
    load_ixx: 0.024
    load_izz: 0.049
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.013
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.95
    cable_notch_hz: 5.3
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.204
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.037
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 220.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100_p115 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0]
    contact_attach:=true carry_clearance:=0.25 mission_mode:=delivery_rejoin commit_backdate:=0.04
    tracking_check:=off cpp_authority:=false end_after_drop:=true climb_speed:=0.3
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 50.0                # LAND ~15 s after the expected drop (no flight of this line yet). Estimated from R2899 less its
                         # pickup: his TAKEOFF 26.3 s, the loaded climb to the lift height (~2.4 m body at 0.3 m/s, ~9 s),
                         # the transit from the mat (1.4 m, ~6.5 s), settle and descend (~3.5 s): drop ~46-48 s; events
                         # after WAIT_LIFT run from LIFTED (~12.4 s later): LAND at ~62 s sim
  do: LAND
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    iso:
      pos:
      - 3.46
      - -3.16
      - 4.66
      look_at:
      - 0.0
      - 0.3
      - 1.2
      hfov_deg: 60.0
      size:
      - 1280
      - 720
