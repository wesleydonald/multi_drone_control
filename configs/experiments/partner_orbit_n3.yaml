name: partner_orbit_n3
description: 'Plan step 3 (authority.md): Tejen''s M1 mission (tejen_mission partner_mission.launch.py)
  flies drone 3 from the floor: pickup of payload_model at (1.2,-1.4), drop into our ring while the three
  carriers fly the continuous orbit (0.2 m/s, r 0.5), then his rejoin descent to plate 9 (270 deg) with
  the magnet ON; our magnet manager welds and the OCP resize folds drone 3 in. Exploratory. Falsifier:
  no ring weld by the end, any abort, or ring tilt > 25 deg.'
world: three_attach_partner.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: attach
    num_drones: 3
    reserved_attach: 1
    start_taut: true
    load_traj: orbit
    traj_speed: 0.125
    traj_radius: 0.5
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    attach_azimuths_deg: 330,90,210
    attach_central: false
    diss_balanced_tensions: true
    attach_handout: true
    attach_t_handout: 12.0
    attach_x_offset: 0.0
    attach_y_offset: -0.25
    attach_elev_deg: 65.0
    attach_traj_hold_s: 10.0
    attach_traj_hold_mode: timed
    control_mode: velocity_after_handover
    vel_ki: 0.0
    diss_ki_load: 1.0
    enable_obstacle_avoidance: false
    kt_trim: true
    z_ki: 0.4
    reconfig_mode: ocp
    safety_ref_timeout_s: 4.0
    pose_timeout_s: 3.0
    attach_cable_len: 0.49
    partner: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 390.0
  stop_after_abort_s: 8.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py
- t: 3.0
  do: ARM
- t: 5.0
  do: TAKEOFF
- t: 7.0
  do: WAIT_LIFT
  arg: 0.5
- t: 375.0
  do: LAND
criteria:
  require_weld: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
