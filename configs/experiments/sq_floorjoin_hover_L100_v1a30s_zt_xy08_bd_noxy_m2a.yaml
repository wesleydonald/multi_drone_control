# Q011 (Wesley 9 Nov, via the thesis chat): sq_floorjoin_hover_L100_p115_v1a30s_zt_xy08_bd_noxy on the 0.86 kg M2A ring: world without _p115, the planner's ring as every final claim on this ring (attach_radius 0.225, attach_z 0.02 and payload_rest_z 0.02 as the world's plates; load_mass 0.86 as configs/rig/ring_m2a.yaml, the inertia untyped (the default 0.02733 / 0.05452, as ring_m2a.yaml and every final claim on this ring)), his geometry rig_twin_L100. Nothing else changed. Then (Wesley 9 Nov): plate worlds for every cell (tools/make_m2a_plate_world.py), his geometry rig_twin_L100_plate, QUAD4's weld point as the M2A ring (attach_y_offset 0.225, weld_point_z 0.032), LAND 30 s after the weld.
# Final-tree claim copy of configs/experiments/sq_floorjoin_hover_L100_p115_v1a30s_zt_xy08_bd.yaml for the batch of 7-8 Nov (docs/claim_batch_2026-11-07.md); the source stays (registry rows cite it). Changed: kxy0_arg.
name: sq_floorjoin_hover_L100_v1a30s_zt_xy08_bd_noxy_m2a
description: 'Final-tree claim copy of sq_floorjoin_hover_L100_p115_v1a30s_zt_xy08_bd (docs/claim_batch_2026-11-07.md): the final-tree re-fly (X11, 4.3 joins) of sq_floorjoin_hover_L100_p115_v1a30s_zt_xy08_bd: the carriers lift a T (plates 0/3/6) until QUAD4 joins on 9, so int_k_xy 0 is typed by Wesley''s fallback of 31 Oct 17:16 (decisions.md: int_k_xy 0 typed in the cells that form a T, now that the rod-in-plan fix was reversed on 4 Nov ~23:00); the sideways integral is off for the whole flight, so a steady sideways offset is not cancelled (on the new links R3701: the T level within 1.8 deg, 47 mm off its point; with it on R3699/R3700 leaned 16.5-17.8 deg). PENDING Wesley''s word (the rule''s text names T cells left by a release). Was: 29 Oct 03:45, one change against sq_floorjoin_hover_L100_p115_v1a30s_zt_xy08, the overnight candidate (V1 0.30 low transit, swing 0.02, attach_twist zero, match_xy 0.08): commit_backdate:=0.04, the ring bridge starts the carriers'' shared commitments 0.04 s before each refresh (his backend refused them when a refresh landed ahead of the same tick''s carrier states; CHANGES_FROM_TEJEN.md 29 Oct). Parent''s description follows. Card 2026-10-28_attach_ambitious, the candidate for the next lab day (29 Oct night, the remaining arms), against sq_floorjoin_hover_L100_p115_v1a30s (R2849/R2850): the V1(0.30) settings of sq_floorjoin_hover_L100_p115_v1a30s (R2849/R2850 passed every Revision-3 bar): attach_transit_clearance 0.30 (the C++ transit ends with the magnet tip 0.30 m above plate 9s contact target), minimum_search_z_m 2.327 (his C++ search floor following it), approach_offset_z 0.30, and his swing envelope max_swing_angle_rad 0.02 (his tracking inflation 0.05 kept), plus attach_twist:=zero (the decided 16 Oct option: ring_bridge zeroes the plates twist in hover) and match_xy:=0.08 (his contact_match_xy_threshold, the V2 replays pick; the twins untyped gate is his code default 0.025 m; his descent abort xy follows as max(gate, 0.05) = 0.08; speed 0.08 m/s and dwell 1.0 s stay his twin defaults). Each of the two added switches is flown alone on A0 the same night (sq_floorjoin_hover_L100_p115_zerotwist, _xy08). Everything else as V1(0.30): the 1.15 kg payload in the _p115 square attach world, his ring model geometry:=rig_twin_L100, throttle_max 0.9, the slope filter on the carriers, no params_file; carriers on plates 0/3/6, QUAD4 (Tejens controller, floor_join) joins plate 9. Exploratory. Falsifier (Revision 3 V1(0.30) bars and the combined bar): TRANSIT_TO_REATTACH not ended within 60 s of its start, the tip at MATCH start outside 0.30 +- 0.06 m above plate 9, no weld within 300 s of his TAKEOFF, an abort or envelope fault, a failed proof, or the rod min (m1 flight) under 0.238 m.'
world: sq_rigid_ground_rig_attach_pickup_L100_plate.sdf
ball_start: [1.6, 2.0, 0.0125]       # tools/make_attach_worlds_L100.py BALL_XY, the plate (unused by floor_join; the runner checks it)
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    int_k_xy: 0.0                # the T (plates 0/3/6) before the join: the sideways integral off (fallback of 31 Oct 17:16)
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.9
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.75
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 0,90,180
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100_plate plate:=9 carrier_azimuths_deg:=[0.0,90.0,180.0]
    contact_attach:=true carry_clearance:=0.25 confirm_pickup_release:=true mission_mode:=floor_join
    attach_transit_clearance:=0.30 minimum_search_z_m:=2.327 approach_offset_z:=0.30
    max_swing_angle_rad:=0.02
    match_xy:=0.08 attach_twist:=zero commit_backdate:=0.04
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_WELD           # our co-motion confirmation; later events are timed from it
  arg: 300
- t: 50.0
  do: LAND                # 30 s after the weld (Wesley 9 Nov, Q011 addendum: Figure 15 shows the steady state)
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: true            # rendered after the run (the stack is down); A0 recorded, render off
  cameras:
    baseline:
      pos: [2.6, -4.4, 3.2]
      look_at: [0.0, 0.4, 1.8]
      hfov_deg: 60.0
      size: [1280, 720]
    top:                  # steep overhead: QUAD4's mat (0, 1.4), its path to plate 9 between the carriers on 0 and 6
      pos: [0.0, -1.0, 6.2]
      look_at: [0.0, 0.45, 1.5]
      hfov_deg: 60.0
      size: [1280, 720]
