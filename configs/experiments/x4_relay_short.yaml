name: x4_relay_short
description: 'X4 endurance relay, the short first check (card 2026-10-30_x4_endurance_relay; exploratory, no bar). 8 quads
  on the R 0.5 m / 0.9 kg ring, 1 m cables, the size-0.5 figure-8 at 0.2 m/s lap by lap (19.2 s laps, 3 s lap-end holds),
  5 SQP iterations, as s8_fig8laps_h5_v200_R50_L100_it5 (R2778). Three leaves, one per lap end 1-3 (relay: section,
  tools/experiment/relay.py): an announced soft detach (detach_unload_s 3) of the oldest pack, which flies to its pad
  (8 s dwell = the recharge) or, at leave 2, an errand (pickup (1.0, 1.56), delivery (-1.0, 1.56), 3 s each), parks there,
  and rejoins its plate in the next lap-end hold (relay_task: the ring 7 through each lap, 8 through the swap). Falsifier
  (exploratory): an abort, a drop, a failed solve, more than 1 % late planner ticks (void), a TASK REFUSED, a RELAY HOLD
  (the path stopped mid-lap), a REJOIN REFUSED / ABORT, a relay leave cancelled, or a release or fold-in over 5 deg.'
world: eight_rigid_ground_rig_R50_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 8
    attach_azimuths_deg: 0,315,270,225,180,135,90,45
    load_traj: fig_8
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.5
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.9
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: false
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/twin/s_chain_pair.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187,0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
    traj_speed: 0.2
    load_ixx: 0.113025
    load_izz: 0.22581
    plan_sqp_iters: 5
    plan_fast_refs: true
    fig8_size: 0.5
    traj_hold_s: 5.0
    traj_laps: 5
    traj_lap_hold_s: 3.0
    detach_unload_s: 3.0
    rejoin_departed: true
    rejoin_task: true
    relay_task: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 8
    sim_thrust_map: rig
    sim_pack_v0: 23.8
    tether_tips: true
    tether_len: 1.0
fleet:
  num_drones: 8
  n_total: 8
timing:
  duration_s: 450.0
  ready_timeout_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 90
relay:
  leaves: 3
  first_lap: 1
  final_laps: 1
  dwell_s: 8.0
  errand_at: [2]
  errand:
    pickup: [1.0, 1.56, 1.926, 3.0]
    delivery: [-1.0, 1.56, 1.926, 3.0]
  pad_margin_m: 0.05
  budget_s: 600.0
  budget_check: report
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    wide:
      pos:
      - 3.6
      - -6.2
      - 3.8
      look_at:
      - 0.0
      - 0.0
      - 1.1
      hfov_deg: 62.0
      size:
      - 1280
      - 720
