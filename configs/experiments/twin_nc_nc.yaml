name: twin_nc_nc
description: 'card 2026-10-09_newcomer_land_abort, NC (negative control, switch off): LAND 8 s into the descend
  phase; expected QUAD4 disarmed in the air at LANDED. Twin R8a dry base (free-start twin attach world, M1 layout
  270/30/150, QUAD4 from (0, 1.4) to plate 9), newcomer_lifecycle off.'
world: three_rigid_ground_rig_attach.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    mode: attach
    reserved_attach: 1
    weld_radius: 0.0
    newcomer_lifecycle: false
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 160.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
  ready_timeout_s: 420.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: MAGNET
  arg: 'ON'
- t: 21.0
  do: WAIT_LOG
  arg: '90 approach: drone 3 descend'
- t: 29.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
