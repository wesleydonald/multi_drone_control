criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'Card 2026-10-21_chain_release, arm 1: c4_release9_base with drop_on_loss on and the chain''s drop rule (configs/rig/chain_pair.yaml:
  opposite_pair_ok, min_survivors 2): the unannounced hover RELEASE of drone 1 (plate 9) at 20 s leaves the T 0/3/6, which
  keeps flying instead of dropping the ring. LAND 20 s after. Bars (frozen in the card): no drop or abort, ring tilt peak
  < 30 deg, the T''s last 10 s < 10 deg, every quad lands.'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- arg: 1
  do: RELEASE
  t: 20.0
- do: LAND
  t: 40.0
fleet:
  n_total: 4
  num_drones: 4
io_launch:
  args:
    detach: true
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
  file: sim_io_launch.py
launch:
  args:
    departed_land: true
    attach_azimuths_deg: 0,270,180,90
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    mode: dissipative
    num_drones: 4
    params_file: /home/wesley/multi_drone_control/configs/rig/chain_pair.yaml
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    departed_ground_idle: true
  file: sim_control_launch.py
  package: bringup
name: c4_release9_pair
timing:
  duration_s: 120.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
world: four_rigid_ground_rig.sdf
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 1.8
      - -3.9
      - 2.5
      look_at:
      - 0.35
      - 0.0
      - 0.9
      hfov_deg: 60.0
      size:
      - 1280
      - 720
