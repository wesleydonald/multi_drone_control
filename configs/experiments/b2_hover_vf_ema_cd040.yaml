name: b2_hover_vf_ema_cd040
description: 'Exploratory (22 Oct, the delayed-twin study; card 2026-10-22_velocity_filter, outside its bars):
  the 2-quad hover at 0.55 m with the mocap velocity filter ema and 40 ms of extra command delay
  (SIM_CMD_DELAY_S, the rig''s radio, Betaflight and motor lag) switched on 24.0 s sim, after the climb.
  Falsifier: no 1.1-1.9 Hz swing above 0.5 deg rms in the old-filter arm at either delay means the command delay
  is not what makes the rig pair swing.'
lab_env:
  SIM_MOCAP_VEL_FILTER: 'ema'
  SIM_CMD_DELAY_S: '0.04'
  SIM_CMD_DELAY_FROM_S: '24.0'
world: two_rigid_ground_rig.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 2
    attach_azimuths_deg: 0,180
    load_traj: hover
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 0.55
    attach_radius: 0.225
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.86
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: true
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/rig/drop_and_land.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185
    sim_pack_v0: 23.8
    traj_speed: 0.2
    drop_tilt_deg: 55.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 2
    sim_thrust_map: rig
    sim_pack_v0: 23.8
fleet:
  num_drones: 2
  n_total: 2
timing:
  duration_s: 86.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 35.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 1.8
      - -3.9
      - 2.5
      look_at:
      - 0.35
      - 0.0
      - 0.9
      hfov_deg: 60.0
      size:
      - 1280
      - 720
