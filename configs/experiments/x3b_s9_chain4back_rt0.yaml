name: x3b_s9_chain4back_rt0
description: 'X3b ground-computer timing run (R8b/R9b, once on tuf, headless, the rig stack down), the real-time setting exactly: (card docs/experiments/2026-10-30_x3b_realtime_8_9.md): 9 -> 5 -> 9 at the real-time setting: plan_sqp_iters 1,
  plan_res_every 0 (no warm-tick residual), plan_fast_refs on; the slope filter (the final tree''s).
  s9_hover_R53_L100_it1 with s8_chain4back''s pattern: RELEASE /drone_1, 5, 3, 7 at 30 / 45 / 60 / 75 s (leaving 0, 2,
  4, 6, 8, typed 0/280/200/120/40: largest gap 80 deg at every step), the freed quads staged (rejoin_departed,
  departed_land false, io tether_tips), rejoins /drone_7, 3, 5, 1, each ATTACH 20 s after the last REJOIN WELD, LAND 30
  s after the last. N9: S''s L, J, N4; also the ground computer''s closed-loop tick at 9 (R9b). Falsifier: a drop, abort
  or failed solve, more than 1 % late ticks (void), a refused or timed-out rejoin, or L or J missed.'
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2,3,4,5,6,7,8
world: nine_rigid_ground_rig_R53_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    plan_rod_level: false        # the real planner (real flights have no rod): pinned at the 4 Nov flip
    mode: dissipative
    num_drones: 9
    attach_azimuths_deg: 0,320,280,240,200,160,120,80,40
    load_traj: hover
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.53
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.9
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: false
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/twin/s_chain_pair.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187,0.181,0.185,0.187,0.187,0.181
    sim_pack_v0: 23.8
    traj_speed: 0.2
    load_ixx: 0.12693
    load_izz: 0.25362
    plan_sqp_iters: 1
    plan_fast_refs: true
    plan_res_every: 0
    rejoin_departed: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 9
    sim_thrust_map: rig
    sim_pack_v0: 23.8
    tether_tips: true
    tether_len: 1.0
fleet:
  num_drones: 9
  n_total: 9
timing:
  duration_s: 420.0
  ready_timeout_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 90
- t: 30.0
  do: RELEASE
  arg: 1
- t: 45.0
  do: RELEASE
  arg: 5
- t: 60.0
  do: RELEASE
  arg: 3
- t: 75.0
  do: RELEASE
  arg: 7
- t: 95.0
  do: ATTACH
  arg: 7
- t: 96.0
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 8
- t: 116.0
  do: ATTACH
  arg: 3
- t: 117.0
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 4
- t: 137.0
  do: ATTACH
  arg: 5
- t: 138.0
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 6
- t: 158.0
  do: ATTACH
  arg: 1
- t: 159.0
  do: WAIT_LOG
  arg: 50 REJOIN WELD drone 2
- t: 189.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    wide:
      pos:
      - 3.6
      - -6.2
      - 3.8
      look_at:
      - 0.0
      - 0.0
      - 1.1
      hfov_deg: 62.0
      size:
      - 1280
      - 720
