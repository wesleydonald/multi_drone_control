criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
description: 'Card 2026-10-23_rejoin_departed E3 neighbour: E1 with LAND 1.5 s into the rejoin''s descent
  (its end still ~10 cm over the plate: the descent takes 2.5 s, so at 5 s it could have welded). Proposed
  falsifier: no REJOIN_ABORT (LAND); the rejoiner not climbing until its end is 0.25 m over the plate
  before it moves out, or coming down within the clear radius (1.2 m) of the ring centre; the line "announcing
  landed anyway", or /fleet/landed (LANDED) before the rejoiner is down; a drop or abort.'
events:
- do: ARM
  t: 3.0
- do: TAKEOFF
  t: 6.0
- arg: 0.3 60
  do: WAIT_LIFT
  t: 8.0
- arg: 1
  do: DETACH
  t: 25.0
- arg: 1
  do: ATTACH
  t: 45.0
- arg: '40 rejoin: drone 2 .*descend'
  do: WAIT_LOG
  t: 46.0
- do: LAND
  t: 47.5
fleet:
  n_total: 4
  num_drones: 4
io_launch:
  args:
    detach: true
    num_drones: 4
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    tether_tips: true
    tether_len: 1.0
  file: sim_io_launch.py
launch:
  args:
    rejoin_departed: true
    departed_land: false
    attach_azimuths_deg: 0,270,180,90
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    detach_unload_s: 3.0
    load_traj: hover
    measure_rod_len: true
    mode: dissipative
    num_drones: 4
    params_file: /home/wesley/multi_drone_control/configs/rig/chain_pair_noxy.yaml
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    departed_ground_idle: true
  file: sim_control_launch.py
  package: bringup
name: rj4_softdetach9_rejoin_land_L100
timing:
