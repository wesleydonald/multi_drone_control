name: u_slot_ri16
description: 'Sim U (docs/experiments/2026-10-23_catch_offset.md; Wesley 22 Oct, push answer 17): the magnet catches 16 cm
  radially in off the slot; the fold-in at the slot (the slot assumed). The claim grid (2 repeats). M1 layout at 1 m: carriers
  on plates 3/11/7, the free 1 m newcomer on our own approach to the moved weld point (as-built trigger: radius 0.025 at weld_point_z
  0.04, gate 0.05 m/s), magnet ON in the hover hold, fold-in on a still ring, 4-quad hover, one figure-8 (size 1.0, 0.2 m/s),
  LAND. Scored by tools/catch_offset.py against the card''s bars (PROPOSED until frozen). Generated by tools/make_catch_offset_configs.py:
  do not edit by hand.'
lab_env:
  SIM_MOCAP_VEL_FILTER: ema
  MDC_MOCAP_VEL_DRONES: 0,1,2
world: three_rigid_ground_rig_attach_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: attach
    num_drones: 3
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    catch_offset_t: 0.0
    catch_offset_r: -0.16
    attach_point_source: slot
    cable_len: 1.0
    attach_radius: 0.225
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.86
    drone_mass: 0.55
    target_z: 1.0
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    creep_vel: 0.2
    lift_ramp_vel: 0.15
    pretension_s: 3.0
    start_taut: false
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
    load_traj: fig_8
    fig8_size: 1.0
    traj_speed: 0.2
    params_file: /home/wesley/multi_drone_control/configs/rig/drop_and_land_hold5.yaml
    traj_hold_s: 75.0
    attach_moving: true
    weld_radius: 0.025
    weld_point_z: 0.04
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
    approach_tip_feedback: false
    approach_tip_log: true
    newcomer_lifecycle: true
    newcomer_fault_land: true
    departed_ground_idle: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 260.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
  ready_timeout_s: 420.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 18.0
  do: MAGNET
  arg: 'ON'
- t: 19.0
  do: WAIT_WELD
  arg: '90'
- t: 20.0
  do: WAIT_LOG
  arg: 200 load trajectory complete
- t: 21.0
  do: LAND
criteria:
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 2.0
      - -4.6
      - 2.9
      look_at:
      - 0.35
      - 0.0
      - 1.3
      hfov_deg: 60.0
      size:
      - 1280
      - 720
