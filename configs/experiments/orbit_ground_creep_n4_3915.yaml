name: orbit_ground_creep_n4_3915
description: 'G7 R5 rig twin: ocp_hover_ground_creep_n4_3915 (four on plates 1/3/5/9 = 30/90/150/270, creep
  floor start, kt_trim on, z_ki 0.4) with load_traj orbit at 0.125 m/s, radius 0.5 (the M1 trajectory, 4 s
  smootherstep spin-up, one lap ~25 s). Events keyed on the lift: WAIT_LIFT 0.5 m holds the schedule, LAND
  34 s after the payload passes 0.5 m (ramp + one lap + margin). Exploratory. Falsifier: payload tilt mean
  > 3 deg over the lap (G1 orbit bar), peak load below 0.35 m, or an abort.'
world: four_rigid_ground_3915.sdf
launch:
  package: controller_quad_load
  file: mpc_quad_load_launch.py
  args:
    num_drones: 4
    load_traj: orbit
    traj_speed: 0.125
    traj_radius: 0.5
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    thrust_ratio: auto
    kt_trim: true
    start_taut: false
    handover_elev_deg: 45.0
    handover_settle_s: 1.0
    lift_ramp_vel: 0.15
    z_ki: 0.4
    creep_vel: 0.2
    attach_azimuths_deg: 30,90,150,270
    pose_timeout_s: 1.0
io_launch:
  file: rviz_quad_load_launch.py
  args:
    num_drones: 4
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 90.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.5
- t: 42.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
