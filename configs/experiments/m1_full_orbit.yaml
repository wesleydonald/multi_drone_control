name: m1_full_orbit
description: 'Full M1 on the rig twin on the circle (0.125 m/s, Wesley 10 Oct; exploratory): as m1_full_hover with the ring orbiting from 5 s after the lift; DETACH 3 half way round (the ring at its far +y point, so QUAD4 steps out clear of the carriers'' path); his rejoin on the moving ring as m1c_orbit.'
world: three_rigid_ground_rig_attach_welded_pickup.sdf
ball_start: [1.0, 1.6, 0.08]       # tools/make_attach_worlds.py BALL_XY (the runner checks the ball's start pose)
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: orbit
    traj_radius: 0.5
    traj_speed: 0.125
    params_file: /home/wesley/multi_drone_control/configs/rig/traj_hold.yaml
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 270,30,150
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    partner_attached: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    attach_cable_len: 0.59
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin plate:=3 carrier_azimuths_deg:=[270.0,30.0,150.0]
    pickup_lift_height:=2.3 minimum_search_z_m:=2.7 drop_approach_clearance:=1.35
    contact_attach:=true confirm_pickup_release:=true start_gate_topic:=/partner/release
- t: 2.0
  do: WAIT_PICKUP_FREE    # his launch frees the ball weld on QUAD4's tip before the creep moves the ring
  arg: 120
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LOG              # the circle starts after the 5 s hover hold (traj_hold.yaml)
  arg: 120 hover hold done
- t: 22.6
  do: DETACH                # 14.6 s into the orbit: theta = 180 deg, the ring at the far +y point, so the
  arg: 3                   # step-out point is 0.5 m outside the carriers' swept circle
- t: 23.6
  do: WAIT_REWELD          # his rejoin: our step-out ~6 s + his mission ~115 s + contact (R1491), give-up 30 s after his first descent
  arg: 180
- t: 31.6
  do: LAND
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
