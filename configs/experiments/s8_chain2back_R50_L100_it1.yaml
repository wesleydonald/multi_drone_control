name: s8_chain2back_R50_L100_it1
description: 'Scalability S, exploratory (-> 2): s8_chain4, then two soft announced detaches (detach_unload_s 3), /drone_2
  (square -> T 0/4/6) and /drone_6 (T -> the opposite pair 0/4), then all six rejoin, /drone_6, 2, 7, 3, 5, 1 (2 -> 8),
  through rejoin_departed as s8_chain4back: each ATTACH 20 s after the last one''s weld (WAIT_LOG, 50 s), LAND 30 s after
  the last. The unannounced release into a T or a pair is chain step 2b, out of this push. Falsifier (exploratory until the
  card''s claim runs): an abort, a drop, a failed solve, more than 1 % late planner ticks (void), a refused or timed-out
  rejoin, or a release tilt over the card''s chain bar.'
lab_env:
  SIM_MOCAP_VEL_FILTER: ema
  MDC_MOCAP_VEL_DRONES: 0,1,2,3,4,5,6,7
world: eight_rigid_ground_rig_R50_L100.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 8
    attach_azimuths_deg: 0,315,270,225,180,135,90,45
    load_traj: hover
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.5
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.9
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: false
    departed_ground_idle: true
    params_file: /home/wesley/multi_drone_control/configs/twin/s_chain_pair.yaml
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187,0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
    traj_speed: 0.2
    load_ixx: 0.113025
    load_izz: 0.22581
    plan_sqp_iters: 1
    plan_fast_refs: true
    rejoin_departed: true
    detach_unload_s: 3.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 8
    sim_thrust_map: rig
    sim_pack_v0: 23.8
    tether_tips: true
    tether_len: 1.0
