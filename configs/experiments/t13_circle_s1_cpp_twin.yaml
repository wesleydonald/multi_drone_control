name: t13_circle_s1_cpp_twin
description: '13 Nov trial twin check (Wesley and Te-Jen 12 Nov; tools/make_t13_configs.py; exploratory, judged after the
  run): QUAD4 holding the object from 1 o''clock 1.9 m out, the ring circling (r 0.3 m, 0.125 m/s), HIS C++ PLANNER FLIES
  THE LOADED TRANSIT (no cpp_authority:=false, no line-up, carrier_model tether). Read: QUAD4''s and the ball''s closest distance
  to each carrier, the drop (ball in the net), the ring stopping for the re-attach, the weld, the four flying on; for the
  checks the path held at rest after the take-back and no tilt or abort. Falsifier: a carrier passed closer than 0.3 m, the
  ball not in the net, no weld in 400 s, the path moving after a figure-eight take-back, an abort.'
world: three_rigid_ground_rig_attach_held_pickup_s1_L100.sdf
ball_start:
- 1.645448
- 0.048847
- 0.08
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 1.0
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    attach_pause: true
    attach_pause_at: reattach
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.2
    throttle_max: 0.95
    cable_notch_hz: 5.3
    drop_tilt_deg: 55.0
    detach_detect_m: 0.15
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    pos_limit_m: 1.8
    mode: attach
    reserved_attach: 1
    attach_azimuths_deg: 90,330,210
    attach_x_offset: 0.0
    attach_y_offset: 0.225
    partner: true
    weld_radius: 0.01
    weld_point_z: 0.032
    partner_contact: true
    proof_rules: comotion
    proof_h_plate: 0.0025
    weld_speed_gate: 0.05
    tip_max_rate_hz: 120.0
    tip_noise_sd_m: 0.0005
    load_traj: orbit
    traj_radius: 0.3
    traj_speed: 0.125
    traj_hold_s: 5.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    clock_hz: 500
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 700.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 5.0
  ready_timeout_s: 420.0
  pose_timeout_s: 8.0
  launch_expect_topics:
  - /join_planner/phase
  - /fake_payload/pose
  dds_udp_only: true
  bg_param_dump: false
events:
- t: 1.0
  do: LAUNCH
  arg: tejen_mission partner_mission.launch.py geometry:=rig_twin_L100 plate:=9 carrier_azimuths_deg:=[90.0,330.0,210.0] contact_attach:=true
    carry_clearance:=0.25 mission_mode:=delivery_rejoin ring_z:=1.2 commit_backdate:=0.04 tracking_check:=off attach_cpp_transit:=false
    attach_transit_clearance:=0.30 minimum_search_z_m:=2.20 approach_offset_z:=0.30 attach_twist:=zero match_xy:=0.05 match_dwell:=0.5
    climb_speed:=0.3 match_speed:=0.20 descent_abort_speed:=0.35 descent_hold:=true descent_debounce:=1.0 descent_abort_xy:=0.05
    contact_give_up_s:=120 contact_dz:=-0.03 lift_full:=true mpc_throttle_max:=0.8 drop_height:=0.48 max_body_z:=2.8 mpc_battery_comp:=0.022
    drop_release:=0.03
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: WAIT_WELD
  arg: 400
- t: 50.0
  do: LAND
criteria:
  require_weld: false
  forbid_abort: true
  min_payload_z: 0.005
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 2.6
      - -4.4
      - 3.2
      look_at:
      - 0.0
      - 0.4
      - 1.8
      hfov_deg: 60.0
      size:
      - 1280
      - 720
