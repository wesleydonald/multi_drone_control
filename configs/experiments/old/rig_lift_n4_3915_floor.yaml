name: rig_lift_n4_3915_floor
description: 'Pretension neighbour (critic 2026-09-30): four drones on plates 1/3/5/9
  (uneven shares), creep floor start with the rig settings (creep 0.2, settle 1.0,
  z_ki 0.4, trim off), pretension 3 s, lift 0.15 to 0.6. Falsifier: ring tilt > 5
  deg during pretension or breakaway, abort.'
world: old_worlds/four_rigid_ground_3915.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: mpc
    num_drones: 4
    load_traj: hover
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    thrust_ratio: auto
    kt_trim: false
    start_taut: false
    handover_elev_deg: 45.0
    handover_settle_s: 1.0
    lift_ramp_vel: 0.15
    z_ki: 0.4
    creep_vel: 0.2
    attach_azimuths_deg: 30,90,150,270
    pose_timeout_s: 1.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 4
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 50.0
  stop_after_abort_s: 8.0
events:
- t: 3.0
  do: ARM
- t: 8.0
  do: TAKEOFF
- t: 44.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
