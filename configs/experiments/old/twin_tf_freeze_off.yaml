name: twin_tf_freeze_off
description: 'card 2026-10-09_approach_tip_feedback rev 5, arm F: E+ and the tip frozen 2 s from 0.5 s into the
  tip hold (switch off)'
world: three_rigid_ground_rig_attach.sdf
geometry_exempt:
  attach_cable_len: 'as flown: QUAD4''s body-to-tip (rod 0.55 + pivot 0.04) typed as its rod, before 22 Oct'
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    attach_radius: 0.225
    attach_z: 0.02
    cable_len: 0.55
    creep_vel: 0.2
    drone_mass: 0.55
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    kt_trim: false
    lift_ramp_vel: 0.15
    load_mass: 0.86
    load_traj: hover
    measure_rod_len: true
    num_drones: 3
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    pretension_s: 3.0
    reconfig_mode: ocp
    rod_spread_m: 0.08
    rod_tol_frac: 0.25
    sim_pack_v0: 23.8
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    start_taut: false
    takeoff_thrust_ratio: 0.0
    target_z: 1.0
    throttle_max: 0.8
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    thrust_ratio: 35.2
    z_i_gate: 0.25
    z_taut_gate: 0.9
    mode: attach
    reserved_attach: 1
    weld_radius: 0.0
    newcomer_lifecycle: true
    newcomer_fault_land: true
    departed_ground_idle: true
    approach_tip_feedback: false
    approach_tip_log: true
    tip_max_rate_hz: 120.0
    attach_cable_len: 0.59
    tip_noise_sd_m: 0.0005
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 3
    attach: true
    sim_pack_v0: 23.8
    sim_thrust_map: rig
fleet:
  num_drones: 3
  n_total: 4
timing:
  duration_s: 170.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
  ready_timeout_s: 420.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 20.0
  do: MAGNET
  arg: 'ON'
- t: 21.0
  do: WAIT_LOG
  arg: '120 approach: drone 3 tip hold'
- t: 21.5
  do: TIP_FREEZE
  arg: 2.0
- t: 52.0
  do: LAND
criteria:
  forbid_abort: true
