name: ocp_hover_ground_creep_n4_3915
description: 'Four drones, creep floor start, LINEAR plant, plates 1/3/5/9 (30/90/150/270) with layout-balanced
  nominal tensions (card 2026-09-25_detach_layout_mode): the 4-ring must hover level at 0.60 before any
  detach is tried. Falsifier: tilt > 5 deg settled, load off 0.60 by > 3 cm, or abort.'
world: old_worlds/four_rigid_ground_3915.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: mpc
    num_drones: 4
    load_traj: hover
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    thrust_ratio: auto
    kt_trim: true
    start_taut: false
    handover_elev_deg: 45.0
    handover_settle_s: 1.0
    lift_ramp_vel: 0.15
    z_ki: 0.4
    creep_vel: 0.2
    attach_azimuths_deg: 30,90,150,270
    pose_timeout_s: 1.0
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 4
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 50.0
  stop_after_abort_s: 8.0
events:
- t: 3.0
  do: ARM
- t: 8.0
  do: TAKEOFF
- t: 44.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
