name: rig_lift_n4_even_floor
description: 'Sim twin of the rig first lift 2026-09-30 (R3b0): four drones on the
  even ring, creep floor start, creep 0.2, settle 1.0, z_ki 0.4, trim off, lift 0.15
  to 0.6. Checks the cable-FF gate change (FF on once the planner lifts, not once
  the ring is off the floor). Exploratory. Falsifier: ring never leaves the floor,
  an abort, drone tilt > 30 deg or ring tilt > 15 deg at breakaway.'
world: four_rigid_ground.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: mpc
    num_drones: 4
    load_traj: hover
    cable_len: 0.5
    load_mass: 0.86
    target_z: 0.6
    thrust_ratio: auto
    kt_trim: false
    start_taut: false
    handover_elev_deg: 45.0
    handover_settle_s: 1.0
    lift_ramp_vel: 0.15
    z_ki: 0.4
    creep_vel: 0.2
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 4
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 50.0
  stop_after_abort_s: 8.0
events:
- t: 3.0
  do: ARM
- t: 8.0
  do: TAKEOFF
- t: 44.0
  do: LAND
criteria:
  min_payload_z: 0.005
  min_peak_payload_z: 0.35
  forbid_abort: true
