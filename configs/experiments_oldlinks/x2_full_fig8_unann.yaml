name: x2_full_fig8_unann
description: 'X2-full B (card docs/experiments/2026-10-30_x2_full_chain_fig8.md): the supervisor''s chain 4 -> 3 -> 2 -> 3 -> 4 in
  one run, every step UNANNOUNCED, the drop limit raised to 80 deg in simulation (the drop rule''s boundary). The square
  0/3/6/9 (typed 0,270,180,90: drones 0-3 on plates 0/9/6/3; 0.86 kg ring, 1 m rods) flies the figure-8 at size 1.0 and
  0.2 m/s, 6 laps (~34.5 s each) held 3 s at each lap end; configs/twin/x2_chain_tip80.yaml (chain_pair_tip.yaml with
  the trackers'' ring-tilt drop at 80 deg, twin only), payload_tilt_envelope false; freed quads staged (rejoin_departed,
  departed_land false, io tether_tips). Square -> T: RELEASE 1 (plate 9) at lap 1.5 (the centre crossing); T -> pair:
  RELEASE 3 (the T''s rider, plate 3) at lap 2.5; pair -> T: ATTACH 3 0.5 s after "lap 4 done"; T -> square: ATTACH 1
  0.5 s after "lap 5 done"; LAND 2 s after lap 6. One variable against x2_full_fig8_soft: that step. Falsifier: a loss
  at 80 deg (drop or a quad''s 60 deg envelope), T6 settle over 5.0 s after the square-to-T release, or any of the
  card''s B2-B6 missed.'
lab_env:
  SIM_MOCAP_VEL_FILTER: slope
  MDC_MOCAP_VEL_DRONES: 0,1,2,3
world: four_rigid_ground_rig_L100_oldlinks.sdf
launch:
  package: bringup
  file: sim_control_launch.py
  args:
    mode: dissipative
    num_drones: 4
    attach_azimuths_deg: 0,270,180,90
    load_traj: fig_8
    fig8_size: 1.0
    traj_speed: 0.2
    traj_hold_s: 5.0
    traj_laps: 6
    traj_lap_hold_s: 3.0
    target_z: 1.0
    lift_ramp_vel: 0.15
    creep_vel: 0.2
    pretension_s: 3.0
    start_taut: false
    cable_len: 1.0
    attach_radius: 0.225
    attach_z: 0.02
    payload_rest_z: 0.02
    pivot_offset_z: -0.04
    load_mass: 0.86
    drone_mass: 0.55
    measure_rod_len: true
    rod_tol_frac: 0.25
    rod_spread_m: 0.08
    z_taut_gate: 0.9
    z_i_gate: 0.25
    ff_cap_force: 0.75
    ff_cap_release_s: 2.0
    handover_settle_s: 1.0
    reconfig_mode: ocp
    thrust_ratio: 35.2
    takeoff_thrust_ratio: 0.0
    thrust_offset: 0.185
    thrust_offset_v_slope: 0.022
    throttle_max: 0.8
    kt_trim: false
    departed_land: false
    departed_ground_idle: true
    rejoin_departed: true
    detach_unload_s: 3.0
    params_file: /home/wesley/multi_drone_control/configs/twin/x2_chain_tip80.yaml
    payload_tilt_envelope: false
    sim_thrust_map: rig
    sim_thrust_offset: 0.181,0.185,0.187,0.187
    sim_pack_v0: 23.8
    plan_sqp_iters: 5
    plan_fast_refs: true
io_launch:
  file: sim_io_launch.py
  args:
    num_drones: 4
    detach: true
    sim_thrust_map: rig
    sim_pack_v0: 23.8
    tether_tips: true
    tether_len: 1.0
fleet:
  num_drones: 4
  n_total: 4
timing:
  duration_s: 700.0
  ready_timeout_s: 600.0
  stop_after_abort_s: 8.0
  stop_after_landed_s: 2.0
events:
- t: 3.0
  do: ARM
- t: 6.0
  do: TAKEOFF
- t: 8.0
  do: WAIT_LIFT
  arg: 0.3 60
- t: 9.0
  do: WAIT_TRAJ
  arg: lap 1.5 150
- t: 9.0
  do: RELEASE
  arg: 1
- t: 10.0
  do: WAIT_TRAJ
  arg: lap 2.5 120
- t: 10.0
  do: RELEASE
  arg: 3
- t: 11.0
  do: WAIT_LOG
  arg: 120 lap 4 done
- t: 11.5
  do: ATTACH
  arg: 3
- t: 12.0
  do: WAIT_LOG
  arg: 60 REJOIN WELD drone 4
- t: 13.0
  do: WAIT_LOG
  arg: 120 lap 5 done
- t: 13.5
  do: ATTACH
  arg: 1
- t: 14.0
  do: WAIT_LOG
  arg: 60 REJOIN WELD drone 2
- t: 15.0
  do: WAIT_TRAJ
  arg: lap 6 120
- t: 17.0
  do: LAND
criteria:
  forbid_abort: false
  min_payload_z: -1.0
  min_peak_payload_z: 0.5
record:
  period_s: 0.0333
  fps: 30
  render: false
  cameras:
    baseline:
      pos:
      - 2.0
      - -4.6
      - 2.9
      look_at:
      - 0.0
      - 0.0
      - 1.1
      hfov_deg: 66.0
      size:
      - 1280
      - 720
