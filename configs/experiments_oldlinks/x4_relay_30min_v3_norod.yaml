# Final-tree claim copy of configs/experiments/x4_relay_30min_v3.yaml for the batch of 7-8 Nov (docs/claim_batch_2026-11-07.md); the source stays (registry rows cite it). Changed: norod.
name: x4_relay_30min_v3_norod
description: 'Final-tree claim copy of x4_relay_30min_v3 (docs/claim_batch_2026-11-07.md): X4 with the rod out of the plan (plan_rod_level false): the plan is massless in simulation and on the rig (Wesley 4 Nov ~23:00, decisions.md; feed F046). Everything else as the adopted v3 setting (Wesley 2 Nov): universal plate hinge, int_k_xy 0 and attach_datum_shift false typed in configs/twin/x4_relay_nowalk.yaml, the pack not draining. One variable against the v3 file, as x4_relay_short_v3_norod (R3483). Was: Exploratory (docs/analysis/x4_relay_fail2_2026-11-01.md, pending Wesley): universal plate hinge, rod in the plan, int_k_xy 0, the pack not draining (B is a budget, not a battery model), the home point held. The 30 min relay. Falsifier: as the card R1-R7.'
